# ══════════════════════════════════════════════════════════════════
# FAZ 2 MICRO — $2000 cüzdan, $100/sembol max, 10 sembol
# ══════════════════════════════════════════════════════════════════
# ⚠️  GERÇEK PARA — ama maruz kalan kısım sınırlı:
#
#   Cüzdan:           $2000
#   Sembol başı max:  $100 notional (3x leverage = $33 margin)
#   Eşzamanlı max:    10 pozisyon × $100 = $1000 max exposure
#   Trade başı risk:  ~$3-10 (SL mesafesine göre)
#   Toplam max risk:  ~$100 (5% bakiye, hepsi SL olursa)
#   Acil durdurma:    Bakiye $1900 altına düşerse HALT
#
# Önkoşullar (preflight.py ile doğrulanmış olmalı):
#   ✓ canTrade = true (futures yetkisi açık)
#   ✓ canWithdraw = false (çekim kapalı)
#   ✓ Position mode = One-way (Hedge değil)
#   ✓ Bakiye Futures cüzdanında ($2000)
#   ✓ EFLOUD_ALLOW_MAINNET=1 (.env'de)
#
# Çalıştırmak için:
#   python main.py configs/config.phase2_micro.yaml

exchange:
  name: binance
  market_type: futures
  api_key: ""              # .env BINANCE_API_KEY
  api_secret: ""           # .env BINANCE_API_SECRET
  testnet: false           # MAINNET
  leverage: 3              # 3x kaldıraç
  margin_mode: ISOLATED    # Pozisyonlar birbirini etkilemez

# ── 10 majör sembol (yüksek likidite, düşük min order size) ──
symbols:
  mode: fixed
  fixed_core:
    - BTC/USDT
    - ETH/USDT
    - BNB/USDT
    - SOL/USDT
    - XRP/USDT
    - ADA/USDT
    - DOGE/USDT
    - LINK/USDT
    - LTC/USDT
    - DOT/USDT
  dynamic_top_n: 0
  dynamic_exclude: []
  refresh_dynamic_hours: 24

timeframes:
  htf: 4h
  mtf: 1h
  entry: 15m
  kline_limit: 500

structure:
  swing_lookback: 5
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk: $100 notional cap, ~$3-10 risk per trade ──
risk:
  risk_per_trade_pct: 0.5            # $10 risk budget per trade ($2000 × 0.5%)
  max_open_positions: 10              # Eşzamanlı max 10 (her sembol için 1)
  min_rr: 1.8                         # Min R:R 1:1.8 (signals.py fix sonrası)
  min_confluence: 60                   # Hafif gevşek (65 → 60), daha çok şans
  recency_bars: 40
  sl_atr_buffer: 0.5
  daily_filter_strict: false

operation:
  check_interval_sec: 30
  dry_run: false                      # ⚠️ GERÇEK ORDER
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_micro.log
  state_dir: ./state_micro
  reports_dir: ./reports_micro

# ── Safety ──
safety:
  daily_loss_limit_pct: 5.0           # $100 günlük max kayıp
  weekly_drawdown_limit_pct: 8.0      # $160 haftalık DD → HALT
  consecutive_loss_limit: 3
  consecutive_pause_min: 120
  starting_balance: 2000              # $2000 başlangıç (gerçek cüzdan)

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5

  # max_position_notional_pct: bakiye × % × leverage = max notional
  # 2000 × 1.7% × 3 = $102 (≈ $100 spec)
  max_position_notional_pct: 1.7
  max_total_exposure: 1.0             # Toplam notional max $2000 (10 × $100 = $1000 zaten altta)
  max_holding_hours: 24
  max_pyramid_adds: 0                  # Pyramid kapalı (basit tut)
  min_sl_atr: 0.5
  max_sl_atr: 5.0

  emergency_balance_threshold: 1900   # Bakiye $1900 altı → HALT (5% kayıp)
  reserve_balance: 0                   # Tüm bakiye kullanılabilir

  min_seconds_between_symbol_fetches: 0.5
