# RESEARCH CANDIDATE CONFIG - PROMOTION REQUIRES HUMAN APPROVAL
# Hypothesis ID: social_ote_fvg_htf_bias_v1
engine:
  smc_v2_shadow: true
  smc_v2_symbols:
  - '*'
  smc_version: v2
  social_research:
    prefer_pullback_zones:
    - OTE
    - FVG
    require_htf_structure: true
exchange:
  api_key: ''
  api_secret: ''
  hedge_mode: true
  leverage: 5
  margin_mode: CROSSED
  market_type: futures
  name: binance
  testnet: false
fibonacci:
  ext_tp2: 1.618
  ote_lower: 0.618
  ote_upper: 0.786
operation:
  check_interval_sec: 30
  dry_run: false
  log_file: ./logs/efloud_1k.log
  log_level: INFO
  parallel_workers: 3
  reports_dir: ./reports_1k
  state_dir: ./state_1k
  symbol_scan_mode: sequential
  watch_only: false
risk:
  daily_filter_strict: false
  max_loss_per_trade_usdt: 20
  max_open_positions: 10
  min_confluence: 50
  min_rr: 1.8
  position_size_calculation: legacy
  recency_bars: 40
  risk_per_trade_pct: 1.0
  sl_atr_buffer: 0.5
  target_stop_distance_pct: 5
safety:
  adx_range_threshold: 20
  adx_trend_threshold: 25
  consecutive_loss_limit: 3
  consecutive_pause_min: 120
  daily_loss_limit_pct: 10.0
  emergency_balance_threshold: 1800
  max_holding_hours: 24
  max_position_notional_pct: 2.0
  max_pyramid_adds: 0
  max_sl_atr: 5.0
  max_total_exposure: 1.0
  min_seconds_between_symbol_fetches: 0.5
  min_sl_atr: 0.5
  reserve_balance: 0
  starting_balance: 2000
  volatile_atr_mult: 2.5
  weekly_drawdown_limit_pct: 15.0
structure:
  body_mode: true
  eq_threshold_pct: 0.1
  ob_sequential: 5
  range_lookback: 50
  swing_lookback: 5
symbols:
  dynamic_exclude: []
  dynamic_top_n: 0
  fixed_core:
  - BTC/USDT
  - ETH/USDT
  - XRP/USDT
  - DOGE/USDT
  - SOL/USDT
  - BNB/USDT
  - TRX/USDT
  - LINK/USDT
  - BCH/USDT
  - ADA/USDT
  mode: fixed
  refresh_dynamic_hours: 24
timeframes:
  entry: 15m
  htf: 4h
  kline_limit: 500
  mtf: 1h
