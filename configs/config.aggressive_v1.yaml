# ══════════════════════════════════════════════════════════════════
# AGGRESSIVE MODE v1 — daily-action focused, 21-coin universe
# ══════════════════════════════════════════════════════════════════
# Built on H2-A2 (parent: config.phase2_1k_h2a2_risk2_notional6.yaml).
# Goal: more daily trade activity without sacrificing per-trade quality.
# Plan: docs/superpowers/specs/2026-05-07-aggressive-mode-v1-design.md
#
# Changes from H2-A2 baseline:
#   confluence:           80 → 70 (global default, weak coins overridden 85-90)
#   max_open_positions:   1 (de-facto) → 5 (now ENFORCED via new gate)
#   max_position_notional_pct: 6.0 → 10.0 (per-trade exposure 1.67x)
#   daily_loss_limit_pct: 10.0 (kept; allows ~5 SL hits before breaker)
#   emergency_threshold:  1800 → 1700 (tighten cushion to 85% of starting)
#   symbols:              10 → 21 (added 11 candidates: AVAX, DOT, ATOM, NEAR,
#                         FIL, LTC, ARB, OP, APT, SUI, RENDER)
#   risk_per_trade_pct:   2.0 (kept — keeps SL distance reasonable; user-confirmed)
#
# Math sanity (per Phase A 2.0 plan §"Math doğrulaması"):
#   Risk 2% × max 5 positions = 10% wallet at risk simultaneously
#                              = matches daily_loss_limit_pct
#   Per trade notional cap 10% × leverage 5 = $1000 max position at $2000
#   5 simultaneous × $1000 = $5000 total notional = max_total_exposure 1.0 × wallet
#                            (under 5x leverage cap — see line below)
#
# Workflow:
#   1. Step 1 (this file) — schema with empty symbol_confluence_overrides
#   2. Step 3 — Phase A 2.0 backtest produces per-symbol metrics
#   3. Step 4 — overrides populated from results (top 30%: 70 default,
#               mid 40%: 80 override, bottom 30%: 85-90 OR drop)
#   4. Step 5 — final validation re-run
#
# Önkoşullar (preflight.py ile doğrulanmış olmalı):
#   ✓ canTrade = true (futures yetkisi)
#   ✓ canWithdraw = false
#   ✓ Position mode = One-way
#   ✓ Bakiye ≥ $1000 Futures cüzdanında
#   ✓ EFLOUD_ALLOW_MAINNET=1
#
# Çalıştırmak için (lokal):
#   python main.py configs/config.aggressive_v1.yaml

exchange:
  name: binance
  market_type: futures
  api_key: ""              # Env: BINANCE_API_KEY
  api_secret: ""           # Env: BINANCE_API_SECRET
  testnet: false           # MAINNET
  leverage: 5              # 5x kaldıraç (orta-agresif)
  margin_mode: ISOLATED    # Pozisyonlar birbirini etkilemez

# ── 21 sembol — 10 H2-A2 baseline + 11 aggressive_v1 yeni (Phase A 2.0 ile validate edilecek) ──
symbols:
  mode: fixed
  fixed_core:
    # Original 10 (H2-A2 baseline)
    - BTC/USDT
    - ETH/USDT
    - XRP/USDT
    - DOGE/USDT
    - SOL/USDT
    - BNB/USDT
    - TRX/USDT
    - LINK/USDT
    - BCH/USDT
    - ADA/USDT
    # New 11 candidates (Phase A 2.0 will tier these into top/mid/bottom)
    - AVAX/USDT
    - DOT/USDT
    - ATOM/USDT
    - NEAR/USDT
    - FIL/USDT
    - LTC/USDT
    - ARB/USDT
    - OP/USDT
    - APT/USDT
    - SUI/USDT
    - RENDER/USDT
  dynamic_top_n: 0
  dynamic_exclude: []
  refresh_dynamic_hours: 24

timeframes:
  htf: 4h
  mtf: 1h
  entry: 15m
  kline_limit: 500

structure:
  swing_lookback: 5
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk: aggressive — 10% notional per trade × 5 positions = 50% net exposure ──
risk:
  risk_per_trade_pct: 2.0             # $40 risk budget per trade @ $2000 (no change vs H2-A2)
  max_open_positions: 5               # ENFORCED gate (commit 20c6ccd) — was effective-1
  min_rr: 1.8                         # Min R:R 1:1.8
  min_confluence: 70                  # Global default; weak coins overridden in symbol_confluence_overrides
  recency_bars: 40
  sl_atr_buffer: 0.5
  daily_filter_strict: false

  # Per-symbol confluence override map. Empty in v1; populated by Step 4 after
  # Phase A 2.0 results. Keys are canonical `BASE/QUOTE` (with slash).
  # Tier rules from plan §Step 4:
  #   Top 30% (best 6-7 symbols)   — omit (use global 70)
  #   Mid 40% (8-9 symbols)        — set 80
  #   Bottom 30% (5-6 symbols)     — set 85-90 OR remove from fixed_core entirely
  symbol_confluence_overrides: {}

  # Opt-in reverse-from-risk (legacy default, mevcut SMC sizing)
  position_size_calculation: legacy
  max_loss_per_trade_usdt: 40         # Bumped 20 → 40 to match risk_per_trade_pct: 2.0
  target_stop_distance_pct: 5

operation:
  check_interval_sec: 30
  dry_run: false                      # ⚠️ GERÇEK ORDER (deploy zamanı manuel doğrulama)
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_aggressive.log
  state_dir: ./state_aggressive
  reports_dir: ./reports_aggressive

# ── Safety: aggressive limits — daily 10% allows ~5 SL hits, weekly 15% halts deeper ──
safety:
  daily_loss_limit_pct: 10.0          # $200 günlük max kayıp; matches 5 × risk_per_trade_pct
  weekly_drawdown_limit_pct: 15.0     # $300 haftalık DD → HALT
  consecutive_loss_limit: 3            # 3 ardışık SL → 120dk pause
  consecutive_pause_min: 120
  starting_balance: 2000              # Session anchor; reset on deploy if wallet differs

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5

  # max_position_notional_pct: kod içinde "margin cap" olarak kullanılıyor.
  # Formül: balance × pct/100 × leverage = max notional per trade
  # 2000 × 10.0% × 5 = $1000 notional max per trade
  # 5 simultaneous × $1000 = $5000 toplam notional (max_total_exposure ile sınırlı)
  max_position_notional_pct: 10.0     # was 6.0 (H2-A2) → 10.0 = +67% per-trade size
  max_total_exposure: 1.0              # Tüm açık notional ≤ wallet (1x net leverage)
  max_holding_hours: 24
  max_pyramid_adds: 0                  # Pyramid kapalı
  min_sl_atr: 0.5
  max_sl_atr: 5.0

  emergency_balance_threshold: 1700    # was 1800 (H2-A2). 85% of starting → tighter floor
  reserve_balance: 0                   # Tüm bakiye kullanılabilir

  min_seconds_between_symbol_fetches: 0.5
