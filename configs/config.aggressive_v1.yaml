# ══════════════════════════════════════════════════════════════════
# AGGRESSIVE MODE v1 — daily-action focused, 9-coin curated universe
# ══════════════════════════════════════════════════════════════════
# Built on H2-A2 (parent: config.phase2_1k_h2a2_risk2_notional6.yaml).
# Goal: more daily trade activity without sacrificing per-trade quality.
# Validation: docs/results/2026-05-07-aggressive-v1-final.md (Phase A 2.0).
#
# Changes from H2-A2 baseline (2026-05-08 bull-aware revision):
#   confluence:           80 → 55 (global) + per-symbol overrides (mid 65, XRP 75)
#   trigger:              CHoCH-only → CHoCH + BOS (continuation breaks now valid)
#   max_open_positions:   1 (de-facto) → 5 → 10 (2026-05-09 user request)
#   max_position_notional_pct: 6.0 → 10.0 (per-trade exposure 1.67x)
#   daily_loss_limit_pct: 10.0 → 20.0 (2026-05-09 — aligned with 10 × 2% risk)
#   weekly_drawdown_limit_pct: 15.0 → 30.0 (2026-05-09 — keeps weekly > daily)
#   emergency_threshold:  1800 → 1700 (tighten cushion to 85% of starting)
#   symbols:              10 H2-A2 → 9 curated (Phase A 2.0 tier-ranked from 21
#                         candidates: top 4 + mid 5 kept, 12 dropped)
#   risk_per_trade_pct:   2.0 (kept — keeps SL distance reasonable)
#
# Math sanity:
#   Risk 2% × max 10 positions = 20% wallet at risk simultaneously
#                              = matches daily_loss_limit_pct (20%)
#   Per trade notional cap 10% × leverage 5 = max $X notional per trade
#                                              (X scales with availableBalance
#                                              under sizing_balance_source: available)
#   10 simultaneous × $X = total notional varies; max_total_exposure cap still 1.0× wallet
#                          (under 5x leverage cap)
#
# Validated portfolio metrics (Step 5 final, 365d backtest):
#   Total return:  +49.12% (H2-A2 was +42.48%)
#   Total trades:  364     (H2-A2 was 206 — 77% more daily action)
#   Max DD:        11.49%  (within 12% target)
#   Profit factor: 2.44
#
# Önkoşullar (preflight.py ile doğrulanmış olmalı):
#   ✓ canTrade = true (futures yetkisi)
#   ✓ canWithdraw = false
#   ✓ Position mode = One-way
#   ✓ Bakiye ≥ $1000 Futures cüzdanında
#   ✓ EFLOUD_ALLOW_MAINNET=1
#
# Çalıştırmak için (lokal):
#   python main.py configs/config.aggressive_v1.yaml

exchange:
  name: binance
  market_type: futures
  api_key: ""              # Env: BINANCE_API_KEY
  api_secret: ""           # Env: BINANCE_API_SECRET
  testnet: false           # MAINNET
  leverage: 5              # 5x kaldıraç (orta-agresif)
  margin_mode: ISOLATED    # Pozisyonlar birbirini etkilemez

# ── 9 sembol — Phase A 2.0 (2026-05-07) tier-ranked from 21 candidates ──
symbols:
  mode: fixed
  # 9 symbols — Step 4 tuning result from Phase A 2.0 (2026-05-07).
  # Dropped 12 negative-return coins: TRX, BNB, AVAX, DOGE, LINK, XRP, APT, NEAR,
  # DOT, BCH, ATOM, ARB. See docs/results/2026-05-07-phase-A-validation-aggressive_v1.md
  fixed_core:
    # Top tier (conf=70 default — best return + low DD)
    - ETH/USDT      # +22.28% / DD 7.37% / PF 2.46
    - SOL/USDT      # +18.78% / DD 5.79% / PF 2.81
    - FIL/USDT      # +8.33%  / DD 6.10% / PF 1.99
    - RENDER/USDT   # +6.18%  / DD 10.44%/ PF 3.56
    # Mid tier (conf=80 override — positive but tighter quality bar)
    - SUI/USDT      # +4.03% (DD 9.25%, override 80)
    - ADA/USDT      # +1.71% (DD 6.26%, override 80)
    - OP/USDT       # +0.81% (DD 9.35%, override 80)
    - LTC/USDT      # +0.80% (DD 7.31%, override 80)
    - BTC/USDT      # +0.17% (DD 7.59%, override 80)
    # Selective tier (conf=85 override — user-requested re-add despite weak Phase A 2.0;
    # high threshold filters most signals to compensate for negative backtest return)
    - XRP/USDT      # -6.63% (DD 10.40%, override 85)
  dynamic_top_n: 0
  dynamic_exclude: []
  refresh_dynamic_hours: 24

timeframes:
  htf: 4h
  mtf: 1h
  entry: 15m
  kline_limit: 500

structure:
  swing_lookback: 5
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk: aggressive — 10% notional per trade × 10 positions = 100% gross exposure ──
risk:
  risk_per_trade_pct: 2.0             # $40 risk budget per trade @ $2000 (no change vs H2-A2)
  max_open_positions: 10              # 2026-05-09 user request — was 5, scaled with daily_loss 20%
  min_rr: 1.8                         # Min R:R 1:1.8
  min_confluence: 55                  # ChoCH(25) + MTF onay(20) + 1 SMC layer(10) — see docs/superpowers/specs/2026-05-08-bull-aware-signal-trigger-design.md
  recency_bars: 40
  sl_atr_buffer: 0.5
  daily_filter_strict: false

  # Per-symbol confluence override map (Step 4 tuning, 2026-05-07).
  # Top tier (ETH/SOL/FIL/RENDER) omitted → use global 70 default.
  # Mid tier overridden to conf=80 to tighten signal quality bar.
  # Bottom 30% (12 originally negative-return symbols) DROPPED from fixed_core
  # entirely (see symbols section above), not overridden.
  symbol_confluence_overrides:
    BTC/USDT: 65
    SUI/USDT: 65
    ADA/USDT: 65
    OP/USDT: 65
    LTC/USDT: 65
    XRP/USDT: 75   # User re-added 2026-05-08; tightened from 85 alongside the 70→55 global recalibration to keep the gap (was 85 vs 70 = +15; now 75 vs 55 = +20)

  # ── Sizing balance source (PR-A, 2026-05-09) ──
  # 'total'     → use totalMarginBalance (wallet + unrealized PnL). Each new
  #               position sized off full equity. Default for backward compat.
  # 'available' → use availableBalance (free margin not locked in positions).
  #               Each new position sized off REMAINING margin → boyutlar
  #               concurrent pozisyon sayısı arttıkça doğal olarak küçülür.
  #               Manuel deposit/withdraw da otomatik yansır (cüzdan büyür →
  #               sonraki trade büyür; cüzdan küçülür → sonraki trade küçülür).
  sizing_balance_source: available

  # Opt-in reverse-from-risk (legacy default, mevcut SMC sizing)
  position_size_calculation: legacy
  max_loss_per_trade_usdt: 40         # Bumped 20 → 40 to match risk_per_trade_pct: 2.0
  target_stop_distance_pct: 5

operation:
  check_interval_sec: 30
  dry_run: false                      # ⚠️ GERÇEK ORDER (deploy zamanı manuel doğrulama)
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_aggressive.log
  state_dir: ./state_aggressive
  reports_dir: ./reports_aggressive

# ── Safety: aggressive limits — daily 20% allows ~10 SL hits, weekly 30% halts deeper ──
safety:
  daily_loss_limit_pct: 20.0          # 2026-05-09: was 10.0 — aligned with 10 × 2% risk
  weekly_drawdown_limit_pct: 30.0     # 2026-05-09: was 15.0 — keeps weekly > daily
  consecutive_loss_limit: 3            # 3 ardışık SL → 120dk pause
  consecutive_pause_min: 120
  starting_balance: 2000              # Session anchor; reset on deploy if wallet differs

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5

  # max_position_notional_pct: kod içinde "margin cap" olarak kullanılıyor.
  # Formül: balance × pct/100 × leverage = max notional per trade
  #   (balance = availableBalance under sizing_balance_source: available — PR #25)
  # 10 simultaneous trades × X notional = total notional (max_total_exposure ile sınırlı)
  max_position_notional_pct: 10.0     # was 6.0 (H2-A2) → 10.0 = +67% per-trade size
  max_total_exposure: 1.0              # Tüm açık notional ≤ wallet (1x net leverage)
  max_holding_hours: 24
  max_pyramid_adds: 0                  # Pyramid kapalı
  min_sl_atr: 0.5
  max_sl_atr: 5.0

  emergency_balance_threshold: 1700    # was 1800 (H2-A2). 85% of starting → tighter floor
  reserve_balance: 0                   # Tüm bakiye kullanılabilir

  min_seconds_between_symbol_fetches: 0.5
