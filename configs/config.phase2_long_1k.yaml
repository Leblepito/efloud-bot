# ══════════════════════════════════════════════════════════════════
# BOT V2 — LONG profil paralel setup  (cüzdan ~$1112)
# ══════════════════════════════════════════════════════════════════
# Bu, V1 (configs/config.phase2_1k.yaml, profile MID) yanında AYNI Hetzner
# VPS'te paralel çalışan İKİNCİ bot'tur (container: efloud-bot-long,
# domain: bot.u2algo.com, EFLOUD_BOT_ID=v2-long, state_dir: ./state_long).
#
# Gerçek Binance Futures bakiyesi: ~$1112 USDT (2026-06-21 canlı totalMarginBalance;
# $1000 USDT V1'den transfer; multiAssetsMargin=False → BNB margin SAYILMAZ).
# safety:/risk: blokları $1112'ye SENKRON (C2 calibration).
#
# Risk profili — LONG KONSERVATİF (operatör onayı 2026-06-21; SENKRON tut):
#   Cüzdan:           ~$1112
#   Kaldıraç:         3x (exchange.leverage; V1=5x — long uzun tutuş → düşük likidasyon riski)
#   Sembol başı max:  ~$67 notional (max_position_notional_pct 2% × $1112 × 3)
#   Eşzamanlı max:    5 pozisyon (max_open_positions; long horizon konsantrasyon kontrolü)
#   Seçicilik:        min_confluence 60, min_rr 2.2 (V1=50/1.8 — long daha seçici)
#   Daily loss:       %10 ≈ $111 → breaker TRIPS (daily_loss_limit_pct)
#   Weekly DD:        %20 ≈ $222 → breaker HALTS (weekly_drawdown_limit_pct; V1'den sıkı)
#   Acil halt:        bakiye $450 altına düşünce (emergency_balance_threshold; wallet-split $500)
#   ⚠️ Long profili backtest-EDİLMEDİ; judgment-based konservatif başlangıç.
#
# Önkoşullar (preflight.py ile YENİ cüzdan key'iyle doğrulanmış olmalı):
#   ✓ canTrade = true (futures yetkisi) — DOĞRULANDI 2026-06-21
#   ✓ Position mode = ONE-WAY (hedge_mode:false; bot startup'ta zorlar — set_position_mode)
#   ✓ Hesap FLAT (pozisyon/order yok — margin/position-mode değişimi flat-book ister)
#   ✓ Bakiye ≥ $500 Futures cüzdanında (emergency_balance_threshold $450 üstü; wallet-split 2026-07-05)
#   ✓ EFLOUD_ALLOW_MAINNET=1
#   ✓ VPS IP (<VPS_IP>) API IP-whitelist'inde — DOĞRULANDI
#
# Çalıştırmak için (lokal test):
#   python main.py configs/config.phase2_long_1k.yaml
#
# VPS'de (efloud-bot-long container, .env.production.long):
#   EFLOUD_CONFIG_PATH=configs/config.phase2_long_1k.yaml
#
# V1 ile FARK: timeframes.profile (long), safety/risk $1035-kalibre,
# state/reports/log path'leri (_long), max_holding_hours (long horizon). Diğer
# her şey (SMC v2 shadow, kronos OFF, orphan/verify/pnl-audit/entry-drift) V1
# ile BİREBİR aynı — parite, diverjans yok.

exchange:
  name: binance
  market_type: futures
  api_key: ""              # VPS env: BINANCE_API_KEY (YENİ cüzdan key)
  api_secret: ""           # VPS env: BINANCE_API_SECRET (YENİ cüzdan secret)
  testnet: false           # MAINNET
  leverage: 3              # 3x — LONG konservatif (uzun tutuş + geniş SL → likidasyon riski az). V1=5x.
  margin_mode: ISOLATED    # per-symbol risk isolation (V1 ile aynı)
  hedge_mode: false        # ONE-WAY; Binance blocks long+short on one symbol

# ── SMC v2 feature flag — V1 ile BİREBİR aynı (parite) ──
engine:
  smc_version: v2               # "v1" | "v2"
  smc_v2_symbols: ["*"]         # ["*"] = all symbols (shadow), [] = no execution
  smc_v2_shadow: true           # true = log v2 signal, skip order placement

# ── 10 majör sembol (V1 ile aynı; operatör daraltabilir) ──
symbols:
  mode: fixed
  fixed_core:
    - BTC/USDT
    - ETH/USDT
    - XRP/USDT
    - DOGE/USDT
    - SOL/USDT
    - BNB/USDT
    - TRX/USDT
    - LINK/USDT
    - BCH/USDT
    - ADA/USDT
  dynamic_top_n: 0
  dynamic_exclude: []
  refresh_dynamic_hours: 24

timeframes:
  # Trade-horizon profile: scalp (5m/1h/12h) | mid (15m/1h/4h) | long (1h/8h/1w) | custom
  # BU BOT = 'long' → entry 1h, mtf 8h, htf 1w (data.timeframes.resolve_timeframes
  # config-load'da otomatik set eder). Profil değiştirmeden ÖNCE flat ol + restart.
  profile: long
  htf: 1w          # custom/fallback (profile=long zaten override eder)
  mtf: 8h
  entry: 1h
  kline_limit: 500

structure:
  swing_lookback: 5
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk: LONG konservatif tuning (operatör onayı 2026-06-21), ~$1112 cüzdan ──
risk:
  risk_per_trade_pct: 1.0             # ~$11 risk budget per trade ($1112 × 1%)
  max_open_positions: 10              # 10 × $50 marjin = $500 (tam cüzdan; operatör 2026-07-04)
  min_rr: 2.2                         # LONG: 1w-yapı büyük hedefler → yüksek R:R (V1=1.8)
  min_confluence: 60                  # LONG: az ama yüksek-konviksiyon setup (V1=50)
  recency_bars: 40
  sl_atr_buffer: 0.5
  daily_filter_strict: false

  position_size_calculation: fixed    # operatör 2026-07-04: sabit $50 marjin/trade
  fixed_position_usdt: 50             # $50 marjin × 3x = $150 notional
  max_loss_per_trade_usdt: 11         # (legacy sizing kalıntısı — fixed modda kullanılmaz)
  target_stop_distance_pct: 5

operation:
  check_interval_sec: 30
  dry_run: false                      # ⚠️ GERÇEK ORDER (go-live: önce AUTOSTART=0 idle, validate, sonra Start)
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_long.log
  state_dir: ./state_long
  reports_dir: ./reports_long

# ── Advisory LLM backend — V1 ile aynı (minimax) ──
llm:
  provider: minimax
  model: MiniMax-M2.7-highspeed

# ── Kronos advisory layer — V1 ile aynı: DEFAULT-OFF (master kill switch) ──
kronos:
  enabled: false
  run_on: [trade_open]
  data_source: yfinance
  interval: "1h"
  period: "1mo"
  pred_len: 12
  max_concurrency: 1
  cooldown_sec: 3600
  synth_timeout_sec: 30
  prewarm_on_start: true
  show_numeric_confidence: false

# ── Safety: ~$1112 cüzdana kalibre (V1 ile SENKRON mantık) ──
safety:
  daily_loss_limit_pct: 10.0          # ~$111 günlük max kayıp ($1112 × 10%)
  weekly_drawdown_limit_pct: 20.0     # ~$222 (long horizon fresh book → V1'den sıkı; operatör-tunable)
  consecutive_loss_limit: 3
  consecutive_pause_min: 120
  starting_balance: 500               # 2026-07-04: cüzdan ikiye bölündü (~500 scalp'e transfer). C2 recalibration.

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5
  # C3 (default OFF) — V1 ile aynı
  regime_ml_can_override_gate: false

  # $50 marjin × 3x = $150 notional per trade ($500 cüzdanın %30'u)
  max_position_notional_pct: 35.0     # $150 notional / $500 balance = %30 (+5 tampon)
  max_total_exposure: 4.0             # 10 × $150 = $1500 / $500 = 3.0x (+1 tampon)
  # max_holding_hours: long horizon (1h entry / 1w htf) → 24h erken çıkışa neden olur.
  # 168h (7 gün) long-horizon trade'lerin gelişmesine izin verir (operatör-tunable).
  max_holding_hours: 168
  max_pyramid_adds: 0
  min_sl_atr: 0.5
  max_sl_atr: 5.0
  # H3 (default OFF) — V1 ile aynı
  reject_wide_sl: false

  emergency_balance_threshold: 450    # Bakiye $450 altı → HALT (~10% kayıp, $500 wallet-split cüzdana göre; 2026-07-05)
  reserve_balance: 0

  min_seconds_between_symbol_fetches: 0.5

  # Entry-drift guard — V1 ile aynı
  max_entry_drift_pct: 1.0

  # ── PnL reconcile audit — V1 ile aynı ──
  enable_pnl_audit: true
  pnl_audit_every_cycles: 20
  # M4 (default OFF) — V1 ile aynı
  breaker_backcorrect_consecutive: false

  # ── SL/TP post-placement verify — V1 ile aynı ──
  enable_post_placement_verify: true
  verify_delay_sec: 2.5
  verify_max_attempts: 3
  rollback_on_sl_failure: true

  # ── Safety Integration — V1 ile aynı ──
  reverse_min_profit_pct: 0.2
  pause_new_entries: false
  orphan_protection:
    enabled: true
    mode: place_missing_sl
    default_sl_pct: 2.0
    max_auto_protect_per_cycle: 1
    min_distance_to_mark_pct: 0.5
    require_tp_present: false

signal_ledger:
  enabled: false
  fill_window_bars: 8
  max_horizon_hours: 48
  resolution_tf: "1m"
  resolver_cadence_sec: 300
  max_symbols: 25
  fetch_fail_alert_pct: 20
