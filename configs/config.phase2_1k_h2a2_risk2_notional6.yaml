# ══════════════════════════════════════════════════════════════════
# H2 VARIANT a2: min_confluence=70 + risk_per_trade_pct=2.0 + max_position_notional_pct=6.0
# Magnitude push from H1b — risk 2x, notional 3x; tests scaling headroom
# Parent: configs/config.phase2_1k_h1b_conf70.yaml (H1b new baseline)
# Spec: docs/superpowers/specs/2026-05-06-h2-magnitude-design.md
# ══════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════
# FAZ 2 — $1000 cüzdan canlı setup
# ══════════════════════════════════════════════════════════════════
# Kullanıcının mevcut Binance Futures bakiyesi: ~1000 USDT + biraz BNB
#
# Risk profili:
#   Cüzdan:           $1000 (gerçek)
#   Sembol başı max:  ~$51 notional (3x leverage = ~$17 margin)
#   Eşzamanlı max:    10 pozisyon × $51 = $510 max notional
#   Trade başı risk:  $1.7-5 (SL mesafesine göre, 0.5% target)
#   Toplam max risk:  ~$50 (tüm 10 trade SL'e giderse, %5 cüzdan)
#   Daily loss:       %5 = $50 → breaker TRIPS
#   Weekly DD:        %8 = $80 → breaker HALTS
#   Acil halt:        bakiye $950 altına düşünce
#
# Önkoşullar (preflight.py ile doğrulanmış olmalı):
#   ✓ canTrade = true (futures yetkisi)
#   ✓ canWithdraw = false (çekim kapalı, key sızsa fon güvende)
#   ✓ Position mode = One-way
#   ✓ Bakiye ≥ $1000 Futures cüzdanında
#   ✓ EFLOUD_ALLOW_MAINNET=1
#
# Çalıştırmak için (lokal):
#   python main.py configs/config.phase2_1k.yaml
#
# Railway'de:
#   EFLOUD_CONFIG_PATH=configs/config.phase2_1k.yaml

exchange:
  name: binance
  market_type: futures
  api_key: ""              # Railway env: BINANCE_API_KEY
  api_secret: ""           # Railway env: BINANCE_API_SECRET
  testnet: false           # MAINNET
  leverage: 5              # 5x kaldıraç (orta-agresif, $2000 cüzdan için)
  margin_mode: ISOLATED    # Pozisyonlar birbirini etkilemez

# ── 10 majör sembol (yüksek likidite, düşük min order) ──
symbols:
  mode: fixed
  fixed_core:
    - BTC/USDT
    - ETH/USDT
    - XRP/USDT
    - DOGE/USDT
    - SOL/USDT
    - BNB/USDT
    - TRX/USDT
    - LINK/USDT
    - BCH/USDT
    - ADA/USDT
  dynamic_top_n: 0
  dynamic_exclude: []
  refresh_dynamic_hours: 24

timeframes:
  htf: 4h
  mtf: 1h
  entry: 15m
  kline_limit: 500

structure:
  swing_lookback: 5
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk: $100 notional cap, ~$10 risk per trade, gevşetilmiş filtreler ──
risk:
  risk_per_trade_pct: 2.0             # $40 risk budget per trade — H2-A2 (was 1.0)
  max_open_positions: 10              # Eşzamanlı max 10 (her sembol için 1)
  min_rr: 1.8                         # Min R:R 1:1.8
  min_confluence: 70                  # H1 variant (h1b) — Epic 6 trade-frequency-reduction sweep
  recency_bars: 40
  sl_atr_buffer: 0.5
  daily_filter_strict: false

  # Opt-in reverse-from-risk (legacy default, mevcut SMC sizing)
  position_size_calculation: legacy
  max_loss_per_trade_usdt: 20
  target_stop_distance_pct: 5

operation:
  check_interval_sec: 30
  dry_run: false                      # ⚠️ GERÇEK ORDER
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_1k.log
  state_dir: ./state_1k
  reports_dir: ./reports_1k

# ── Safety: agresif (bütün cüzdan kullanılabilir, %10 daily loss tolerans) ──
safety:
  daily_loss_limit_pct: 10.0          # $200 günlük max kayıp ($2000 × 10%)
  weekly_drawdown_limit_pct: 15.0     # $300 haftalık DD → HALT
  consecutive_loss_limit: 3
  consecutive_pause_min: 120
  starting_balance: 2000              # $2000 başlangıç (gerçek cüzdan, $1000 + $1000 ek transfer)

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5

  # max_position_notional_pct: kod içinde "margin cap" olarak kullanılıyor (notional/leverage)
  # 2000 × 2.0% × 5 = $200 notional max → 10% of available balance per trade
  # 10 sembol × $200 = $2000 toplam notional (cüzdanın tamamı, 1x net leverage cap)
  max_position_notional_pct: 6.0      # max $600 notional per trade — H2-A2 (was 2.0)
  max_total_exposure: 1.0             # Toplam notional max $2000 (cüzdan tamamı, 1x net leverage)
  max_holding_hours: 24
  max_pyramid_adds: 0                  # Pyramid kapalı (basit tut)
  min_sl_atr: 0.5
  max_sl_atr: 5.0

  emergency_balance_threshold: 1800   # Bakiye $1800 altı → HALT (10% kayıp)
  reserve_balance: 0                   # Tüm bakiye kullanılabilir

  min_seconds_between_symbol_fetches: 0.5
