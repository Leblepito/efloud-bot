# ══════════════════════════════════════════════════════════════════
# FAZ 1 — Mainnet Data + Dry Run
# ══════════════════════════════════════════════════════════════════
# Bu config:
#   ✓ Gerçek Binance mainnet verisini çeker (likit, trending)
#   ✗ HİÇ gerçek order göndermez
#   ✓ Bakiye risk altında DEĞİL
#   ✓ Sinyal üretir ama sadece logger
#
# Çalıştırmak için:
#   python main.py configs/config.phase1.yaml
#
# GEREKLI MAINNET API KEY (sadece read yetkisi, trading kapalı olsun):
#   1. https://www.binance.com/en/my/settings/api-management
#   2. "Create API"
#   3. İzinler: "Enable Reading" sadece (Enable Trading ve Withdrawals KAPALI)
#   4. IP whitelist ekle (kendi IP'in)
#   5. Key'i .env dosyasına koy

exchange:
  name: binance
  market_type: futures
  api_key: ""              # env var BINANCE_API_KEY kullan
  api_secret: ""           # env var BINANCE_API_SECRET kullan
  testnet: false           # MAINNET (gerçek veri)
  leverage: 3
  margin_mode: ISOLATED    # Pozisyonlar yalıtık margin ile (cross değil)
                            # ISOLATED: her pozisyon kendi başına, biri likidasyon olsa diğerleri etkilenmez

# ── Symbol universe ──
symbols:
  mode: fixed
  fixed_core:
    - BTC/USDT
    - ETH/USDT
    - XRP/USDT
    - BNB/USDT
    - SOL/USDT
    - TRX/USDT
    - DOGE/USDT
    - ADA/USDT
    - BCH/USDT
    - LINK/USDT
    - ZEC/USDT
    - LTC/USDT
    - AVAX/USDT
    - DOT/USDT
    - TON/USDT
    - NEAR/USDT
    - ATOM/USDT
    - APT/USDT
    - UNI/USDT
    - ICP/USDT
  dynamic_top_n: 0
  dynamic_exclude:
    - USDC/USDT
    - FDUSD/USDT
  refresh_dynamic_hours: 24

# ── Timeframe chain — 4 TF Efloud yapısı ──
# Daily (1d) makro filter olarak kullanılıyor:
#   - Confluence skoruna ±5 puan etkisi (1d aligned ise +5, ters ise -5)
#   - Strict mode: ters yön ise sinyal tamamen reddedilir (risk.daily_filter_strict)
timeframes:
  htf: 4h            # High Timeframe — bias belirleyici
  mtf: 1h            # Mid Timeframe — onay
  entry: 15m         # Entry Timeframe — giriş
  kline_limit: 500   # 1d için ayrıca 100 bar otomatik çekilir

# ── Structure ──
structure:
  swing_lookback: 5
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

# ── Fibonacci ──
fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk ──
risk:
  risk_per_trade_pct: 0.75
  max_open_positions: 7
  min_rr: 2.0
  min_confluence: 55
  recency_bars: 40
  sl_atr_buffer: 0.5
  daily_filter_strict: false       # FAZ 1 — yumuşak (1d aligned +5 conf, ters -5)
                                    # FAZ 2'de true yapacağız: ters yön → komple reddet

# ── Operation ──
operation:
  check_interval_sec: 30
  dry_run: true                     # FAZ 1 — order gönderme, sadece logla
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_phase1.log
  state_dir: ./state_phase1         # Ayrı klasör — testnet state'iyle karışmasın
  reports_dir: ./reports_phase1

# ── Safety ──
safety:
  daily_loss_limit_pct: 3.0
  weekly_drawdown_limit_pct: 8.0
  consecutive_loss_limit: 3
  consecutive_pause_min: 120
  starting_balance: 10000

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5

  max_position_notional_pct: 3.0
  max_total_exposure: 3.0
  max_holding_hours: 48
  max_pyramid_adds: 2
  min_sl_atr: 0.5
  max_sl_atr: 5.0

  # ── v2.2.0 yeni alanları ──
  # Emergency stop: bakiye bunun altına düşerse HALT (mutlak USDT)
  # Phase 1'de dry_run olduğundan etkisiz, ama parametre tanımlı.
  emergency_balance_threshold: null   # null = devre dışı (dry_run için)
  # Reserve: yeni pozisyon açarken bu kadar USDT'ye dokunma
  reserve_balance: 0                   # Phase 1: 0 (dry_run)

  min_seconds_between_symbol_fetches: 0.5
