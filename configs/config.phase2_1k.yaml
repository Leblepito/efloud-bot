# ══════════════════════════════════════════════════════════════════
# FAZ 2 — V1 canlı setup (profile mid; dosya adı "1k" LEGACY; cüzdan ~$1363)
# ══════════════════════════════════════════════════════════════════
# 2026-06-20: $1000 USDT V2'ye (paralel long-bot) transfer edildi → V1 gerçek
# totalMarginBalance ~$1071 (totalWallet ~$1065). safety: bloğu $1065'e RECALIBRE
# (C2; eski $2000 baseline transfer sonrası yanlış→ breaker false TRIP/HALT veriyordu).
# 2026-07-08 (C2 re-recalibration, GERİ ALINDI 2026-07-09): O gün V1+V2+V3'ün TEK
# ortak Binance cüzdanını paylaştığı varsayılmış ve starting_balance 1065→602
# düşürülmüştü. 2026-07-09'da operatör her botun GERÇEKTEN kendi ayrı Binance
# sub-account'ında (kendi API key + kendi izole futures cüzdanı) çalıştığını
# doğruladı (Binance app'te 3 hesaba tek tek giriş yapılarak kontrol edildi) —
# "tek ortak cüzdan" varsayımı YANLIŞTI. V1'in (bu config) gerçek, izole bakiyesi
# şu an ~$1363 — starting_balance buna göre 602→1363, emergency_balance_threshold
# 537→1216 olarak DÜZELTİLDİ (orijinal %89.2 oran korunarak: 950/1065).
# 2026-07-09: risk.sizing_balance_source: available eklendi (aşağıda) — bu KENDİ
# hesabın içinde aynı anda açık pozisyonların kilitlediği marjini doğru hesaba
# katmak için (Binance'ın canlı availableBalance'ı), paylaşımlı cüzdan meselesiyle
# ilgisi yok — yine de faydalı bir sizing iyileştirmesi, korunuyor.
# Not: multiAssetsMargin=False → BNB margin sayılmaz, sizing USDT totalMarginBalance.
#
# 2026-07-24 (operatör talebi): sizing legacy (%risk-bazlı) → FIXED, V2/V3 ile aynı
# model. Sembol başı sabit $50 marjin × 10x kaldıraç = $500 notional (bakiyeden
# bağımsız). Kaldıraç 5x→10x: likidasyon mesafesi ~%20'den ~%10'a düşer (ISOLATED
# margin, ani %10 ters harekette pozisyon likide olabilir) — operatörün net talebi
# buydu, kabul edilmiş risk trade-off'u olarak kaydediliyor.
# TÜRETİLMİŞ değişiklikler (operatör bunları açıkça istemedi ama fixed+10x'in
# ÇALIŞMASI için ZORUNLU — yoksa aşağıdaki iki guard TÜM emirleri sessizce
# reddeder, bkz. [[efloud-incident-2026-07-23]] tarzı "işlem yok" bug'ı):
#   (a) safety.max_position_notional_pct 2.0→35.0 — engine/safety/position_guard.py
#       can_open_position HER sizing modunda margin($50) ≤ balance×pct kontrolü
#       yapar (calc_fixed_position_size bu alanı KULLANMAZ ama guard onu görmez,
#       yine de reddeder). Eski %2 ~$27 marjine izin verirdi (<$50 → her emir red).
#   (b) safety.max_total_exposure 1.0→6.0 — 10 pozisyon × $500 = $5000 notional ≈
#       cüzdanın (~$1363) 3.7x'i; eski 1.0x cap 2-3 pozisyondan sonra yeni girişi
#       keserdi, max_open_positions=10 hedefine fiilen ulaşılamazdı.
# ÖNEMLİ — restart öncesi kontrol: mevcut açık pozisyon varken restart+Start
# yapılırsa set_leverage o sembol için Binance'a YENİDEN gönderilir (backend/
# bot_runner.py _enforce_margin_setup, her Start'ta tüm sembollerde çalışır) —
# mevcut pozisyonun boyutu DEĞİŞMEZ ama marjini/likidasyon fiyatı YENİ kaldıraca
# göre yeniden hesaplanır (likidasyon mesafesi daralır). Önerilen: Start'a
# basmadan önce dashboard → Positions'ın boş (flat) olduğunu doğrula.
#
# Risk profili (safety: bloğuyla SENKRON — değiştirirsen İKİSİNİ birlikte güncelle):
#   Cüzdan:           ~$1363 (2026-07-09 düzeltme; kendi izole Binance sub-account'ı) — YENİDEN DOĞRULA
#   Kaldıraç:         10x (exchange.leverage; 2026-07-24 operatör talebi, WAS 5x)
#   Sizing modu:      FIXED — $50 margin/coin × 10x = $500 notional/pozisyon (2026-07-24, WAS legacy %risk-bazlı)
#   Eşzamanlı max:    10 pozisyon (max_total_exposure 1.0→6.0, 10×$500 desteklemek için)
#   Daily loss:       %10 ≈ $136 → breaker TRIPS (daily_loss_limit_pct)
#   Weekly DD:        %25 ≈ $341 → breaker HALTS (weekly_drawdown_limit_pct)
#   Acil halt:        bakiye $1216 altına düşünce (emergency_balance_threshold)
#
# Önkoşullar (preflight.py ile doğrulanmış olmalı):
#   ✓ canTrade = true (futures yetkisi)
#   ✓ canWithdraw = false (çekim kapalı, key sızsa fon güvende)
#   ✓ Position mode = ONE-WAY (hedge_mode:false; bot startup'ta zorlar — set_position_mode)
#   ✓ Bakiye ≥ $1363 Futures cüzdanında (emergency_balance_threshold $1216 üstü)
#   ✓ EFLOUD_ALLOW_MAINNET=1
#
# Çalıştırmak için (lokal):
#   python main.py configs/config.phase2_1k.yaml
#
# Railway'de:
#   EFLOUD_CONFIG_PATH=configs/config.phase2_1k.yaml

exchange:
  name: binance
  market_type: futures
  api_key: ""              # Railway env: BINANCE_API_KEY
  api_secret: ""           # Railway env: BINANCE_API_SECRET
  testnet: false           # MAINNET
  leverage: 10             # 2026-07-24 operatör talebi: 5x→10x (WAS 5x "orta-agresif, $2000 cüzdan için")
  margin_mode: ISOLATED    # PR A ACTIVE (2026-06-02): flat-book deploy — per-symbol risk isolation
  hedge_mode: false        # PR A ACTIVE: ONE-WAY; Binance blocks long+short on one symbol

# ── SMC v2 feature flag (PR #S6 + cycle 4 hotfix) ──
# Inert default: smc_version=v1, smc_v2_symbols=[] → v1 path active, v2 dormant.
# Shadow rollout: set smc_version=v2 + smc_v2_symbols=["*"] + smc_v2_shadow=true
#   → v2 signals computed and logged to logs/smc_v2_shadow.log, NO orders placed.
# Live v2 (Hermes-only): set smc_v2_shadow=false. Per-symbol opt-in via
# smc_v2_symbols=["ETH/USDT","BTC/USDT",...] for phased rollout.
# H2: a literal "*" whitelist is REJECTED for LIVE placement — live v2 requires an
# EXPLICIT per-symbol list AND smc_v2_shadow:false (two independent conditions).
# "*" still permits shadow-mode logging across all symbols.
#
# IMPORTANT: This is the production-active config (.env.production
# EFLOUD_CONFIG_PATH=configs/config.phase2_1k.yaml). Root config.yaml is the
# CLI default but bot_runner (FastAPI mode) does NOT read it. Always edit
# THIS file for production changes.
engine:
  smc_version: v2               # "v1" | "v2"
  # LIVE (operatör onayı 2026-07-07): explicit whitelist = fixed_core (aşağıdaki
  # symbols.fixed_core ile birebir aynı) + shadow:false. "*" LIVE'da reddedilir (H2).
  smc_v2_symbols: ["BTC/USDT", "ETH/USDT", "XRP/USDT", "DOGE/USDT", "SOL/USDT",
                   "BNB/USDT", "TRX/USDT", "LINK/USDT", "BCH/USDT", "ADA/USDT"]
  smc_v2_shadow: false          # LIVE (operatör onayı 2026-07-07): gerçek emir

  # BT-22 (operatör onayı 2026-07-26): SL/TP geometrisi artık %1-of-price
  # proxy'si yerine GERÇEK Wilder ATR(14) kullanıyor. Bu satır olmadan
  # safety.max_sl_atr: 5.0 fiilen "fiyatın %5'i" demek ve hiç bağlamıyordu;
  # 336 canlı işlemde medyan atılan stop 4.02 gerçek ATR, p90 8.29, max 16.69.
  # 5 ATR tavanı gerçek ATR ile: 223 işlem kalır / 113 elenir, PnL +403.74 ->
  # +595.66 USDT, kazanç %66.7 -> %85.2. Daha az giriş İSTENEN sonuç.
  v2_use_real_atr: true

# ── SMC v2 davranış anahtarları (W2/C1+C2, 2026-07-18) ──
# İkisi de default-OFF: kod hazır + testli; NET-cost 1000-bar backtest gate
# Windows'ta koşulup SONUÇ ONAYLANINCA operatör true yapar. false = birebir
# eski canlı davranış (bu commit canlı mantığı DEĞİŞTİRMEZ).
smc_v2:
  anchor_time_axis: false       # C1: SL çapası seçiminde LTF kırılım zamanı
                                #     HTF eksenine haritalanır (lookahead fix)
  confirm_last_bar_only: false  # C2: yalnız son kapanmış bar engulfing onayı
                                #     (stale onay biter)

  # BT-23 (2026-07-26): emit anında hedef bölgenin YAKIN kenarı 15m Wilder
  # ATR(14)'ün bu katından uzaksa setup hiç açılmaz. 30g/10 sembol tam pipeline
  # replay: 4.0 ATR ötesinde 2401 setup'ın HİÇBİRİ CONFIRMED olmadı (1400 ölü
  # setup = %58.3). Ölü setuplar per-symbol cap'i doldurup ulaşılabilir
  # setupları eliyordu. Kapı 6.0 ile: added 2401->1188, EXPIRED 1804->588,
  # cap_dropped 3256->1010, CONFIRMED 594->597 (hiçbir sembolde kayıp yok).
  # 6.0 seçildi (4.0 değil): uçurum 4.0'da ölçüldü, 1.5x pay bırakıldı.
  # 0.0 = kapalı (diğer configlerin varsayılanı — ölçülmediler).
  max_entry_dist_atr: 6.0

  # BT-25 adim 1 (2026-07-27): pullback bekleme suresi 8 -> 24 bar (6 saat).
  # Kod varsayilani 8 bar; config'te bu anahtar YOKTU, yani canli bot 2 saatte
  # bir adayi EXPIRED yapiyordu. EXPIRED -> prune() -> ayni CHoCH hala
  # recency_bars: 40 penceresinde oldugu icin YENI SetupCandidate olarak tekrar
  # emit ediliyor ve has_left_zone=False'a sifirlaniyor. Yani "bolgeye girdi,
  # cikti" ilerlemesi her 8 barda cope gidiyordu; giris zinciri (bolgeye gir ->
  # cik -> tekrar gir -> engulfing onayi = 4 olay) 2 saate sigmiyor. 24 bar
  # recency_bars: 40'in altinda kalir, yani aday CHoCH hala gecerliyken yasar.
  pullback_timeout_bars: 24

  # BT-25 adim 2 (2026-07-27): max_entry_dist_atr TEK TARAFLI -- sadece "bolge
  # cok ILERIDE" durumunu eler. Fiyatin coktan ICINDEN GECTIGI bolge negatif
  # mesafe verir ve kapidan sorunsuz gecer. v2_doctor canlida tam bunu yakaladi:
  # BNB/USDT bias=BEAR, SHORT adayi, bolge fiyatin 4.2 ATR ALTINDA -- pullback'in
  # yanlis tarafi. Boyle bir aday hic ilerleyemez, sadece per-symbol slot'u
  # doldurup expire olur. Bu anahtar bolgenin UZAK kenarini olcer (bolge
  # genisliginden bagimsiz): fiyat uzak kenari bu kadar ATR'den fazla gectiyse
  # setup acilmaz. 0.5 = yarim ATR tolerans. Anahtar YOKSA kapi kapali.
  max_zone_overshoot_atr: 0.5

# ── 10 majör sembol (yüksek likidite, düşük min order) ──
symbols:
  mode: fixed
  fixed_core:
    - BTC/USDT
    - ETH/USDT
    - XRP/USDT
    - DOGE/USDT
    - SOL/USDT
    - BNB/USDT
    - TRX/USDT
    - LINK/USDT
    - BCH/USDT
    - ADA/USDT
  dynamic_top_n: 0
  dynamic_exclude: []
  refresh_dynamic_hours: 24

timeframes:
  # Trade-horizon profile: scalp (5m/1h/4h) | mid (15m/4h/12h) | long (1h/8h/1d) | custom
  # 'mid' == 15m/4h/12h (operatör 2026-07-06). Profil seçilince entry/mtf/htf
  # data.timeframes.resolve_timeframes ile config-load'da otomatik set edilir.
  # Profil değiştirmeden ÖNCE flat ol + restart (bkz. spec Risk-Ops).
  profile: mid
  htf: 12h         # custom/fallback (profile yoksa/custom ise kullanılır)
  mtf: 4h
  entry: 15m
  kline_limit: 500

structure:
  swing_lookback: 5
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk: $100 notional cap, ~$10 risk per trade, gevşetilmiş filtreler ──
risk:
  risk_per_trade_pct: 1.0             # $20 risk budget per trade ($2000 × 1%)
  max_open_positions: 10              # Eşzamanlı max 10 (her sembol için 1)
  min_rr: 1.8                         # Min R:R 1:1.8 (legacy gate — smc_tp_targeting açıkken kullanılmaz)
  # ── v3.2 Entry-anchored SMC TP targeting (spec 2026-07-11) ──
  # TP1 = entry'ye EN YAKIN yapısal blok (>= 0.5R): MTF/HTF likidite, OB/FVG,
  # range EQ (0.50) ve range ekstremi. Blended gate: 0.5×TP1_R + 0.5×TP2_R >= 1.5.
  # Eski davranış (yalnız 12h HTF hedefleri >= 1.8R) TP1'i 3-6R uzağa koyuyordu →
  # pozisyonlar TP1 görmeden stop oluyordu (operatör raporu 2026-07-11).
  smc_tp_targeting: true
  min_rr_tp1: 0.5
  blended_rr_target: 1.5
  min_confluence: 50                  # Adjusted from 80 to 50 per operator request to increase trade frequency
                                      # conf=50 +81%/DD8.3/PF1.35/WR44.5 vs conf=80
                                      # +110%/DD5.4/PF2.34/WR53.7 (step=8). conf=50 PF
                                      # ustura-ince (fee'siz); conf=80 her metrikte domine.
                                      # docs/audit/03_strategy_review.md (S1).
  recency_bars: 40
  sl_atr_buffer: 0.5
  daily_filter_strict: false

  # 2026-07-24 operatör talebi: legacy (%risk-bazlı) → fixed (V2/V3 ile aynı model).
  position_size_calculation: fixed
  fixed_position_usdt: 50             # $50 marjin × 10x = $500 notional/pozisyon — AKTİF
  max_loss_per_trade_usdt: 10         # (legacy sizing kalıntısı — fixed modda kullanılmaz)
  target_stop_distance_pct: 5

  # 2026-07-09 (düzeltildi): V1/V2/V3'ün TEK ortak cüzdanı paylaştığı varsayımı
  # YANLIŞTI — her botun kendi ayrı Binance sub-account'ı var. "available" yine de
  # faydalı: KENDİ hesabı içinde aynı anda birden fazla pozisyon açıkken canlı
  # availableBalance (_sizing_balance, engine/safe_orchestrator.py:47-99) "total"a
  # (statik totalMarginBalance) göre daha isabetli boyutlandırma verir.
  sizing_balance_source: available

operation:
  check_interval_sec: 30
  dry_run: false                      # ⚠️ GERÇEK ORDER
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_1k.log
  state_dir: ./state_1k
  reports_dir: ./reports_1k

# ── Advisory LLM backend (sentiment + structure validation + agent team) ──
# Provider: minimax (active) | claude | gemini. Key from the provider's env var
# (MINIMAX_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY) — never in config.
# Global lever: env LLM_PROVIDER=<provider> flips every call site at once
# (incl. the no-config ones: structure validation + alerter formatter).
# Advisory only & fail-safe: any LLM outage → deterministic fallback, never blocks a trade.
llm:
  provider: minimax
  model: MiniMax-M2.7-highspeed       # fast low-latency variant; advisory needs no heavy reasoning

# ── Kronos advisory layer (time-series forecast + LLM synthesis) ──────────────
# ADDITIVE & ADVISORY-ONLY: produces commentary + a categorical band for Telegram
# (and the DB when present). It NEVER feeds trade/sizing/SL-TP/confluence logic.
# DEFAULT-OFF master kill switch. Operator pre-warm step before first enable:
#   python external_repos/kronos-claude-skill/scripts/run_kronos.py BTC-USD 1mo 1h 12
kronos:
  enabled: false              # MASTER kill switch. false → fully inert (no subprocess/LLM/Telegram).
  run_on: [trade_open]        # subset of [trade_open, readonly]. readonly = whole-universe fan-out
                              #   (OOM/spam vector) → opt-in only, enable AFTER trade_open is proven clean.
  data_source: yfinance       # yfinance (spot, default/works today) | binance (perp klines — code-ready,
                              #   but requires the PATCHED skill deployed (external_repos gitignored) + a
                              #   parquet engine in the sub-venv. Keep yfinance until that's provisioned.)
  interval: "1h"             # forecast bar interval
  period: "1mo"              # history window
  pred_len: 12                # forecast horizon in bars (aligned to intraday, NOT a 24h point bet)
  max_concurrency: 1          # dedicated bounded executor + Semaphore — caps concurrent torch loads
  cooldown_sec: 3600          # per (symbol,direction,bar) dedup window
  synth_timeout_sec: 30       # hard timeout around the LLM synthesis call
  prewarm_on_start: true      # build/warm the sub-venv + model at startup, off the trade path
  show_numeric_confidence: false  # false → Telegram shows categorical band (no fake 0-100 vs confluence)
  # provider/model resolved via make_llm_client → reuses the `llm:` block above + LLM_PROVIDER env.

# ── Safety: agresif (bütün cüzdan kullanılabilir, %10 daily loss tolerans) ──
safety:
  daily_loss_limit_pct: 10.0          # $200 günlük max kayıp ($2000 × 10%)
  weekly_drawdown_limit_pct: 25.0     # 2026-06-01: 20→25 (operator) — daha geniş haftalık DD toleransı
  consecutive_loss_limit: 3
  consecutive_pause_min: 120
  starting_balance: 1363              # 2026-07-09 düzeltme: kendi izole Binance sub-account bakiyesi. Bkz. dosya başı.

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5
  # C3 (default OFF): true → the ML regime model may overwrite the deterministic
  # regime that feeds the entry gate (can_open_new_position). FALSE = ML advisory/
  # log-only. Flip true ONLY after forward-labels training + a regime-conditioned
  # NET-PnL backtest (the model is circular-trained on rule labels today).
  regime_ml_can_override_gate: false

  # max_position_notional_pct: engine/safety/position_guard.py can_open_position
  # içinde MARGIN cap'i olarak kullanılır (full_notional/leverage ≤ balance×pct/100).
  # "fixed" sizing modunda calc_fixed_position_size (risk/__init__.py) bu alanı
  # OKUMAZ, ama position_guard HER modda bu kontrolü uygular — İNERT DEĞİL.
  # 2026-07-24: 2.0→35.0 (V2/V3 ile aynı tampon) — $50 marjin / ~$1363 bakiye ≈
  # %3.7; eski %2 cap'i (~$27 marjin) altında kalıp HER emri reddederdi.
  max_position_notional_pct: 35.0     # guard margin-cap tamponu (fixed modda gerçek kullanım ~%3.7, WAS 2.0)
  # max_total_exposure: 10 pozisyon × $500 notional = $5000 ≈ cüzdanın (~$1363) 3.7x'i.
  # 2026-07-24: 1.0→6.0 — eski 1.0x cap ~2-3 pozisyondan sonra yeni girişi keserdi,
  # max_open_positions=10 hedefine fiilen ulaşılamazdı. 6.0, emergency_balance_
  # threshold ($1216) altına inmeden bind ETMEZ (6.0×1216=$7296 > $5000).
  max_total_exposure: 6.0             # 10×$500 desteklemek için yükseltildi (WAS 1.0)
  max_holding_hours: 36           # 2026-07-26 BT-sweep5: 24h->36h. Ayni islemler, secim degismiyor. v1 -18.9R->-1.1R, v2 -43.5R->-19.8R. 48h daha kotu.
  max_pyramid_adds: 0                  # Pyramid kapalı (basit tut)
  min_sl_atr: 2.0                 # 2026-07-26 BT-sweep5: 0.5->2.0. v2 R/trade -0.363->-0.257 (floor 2.5 daha kotu). fixed sizing: min risk 0.86 USD -> 3.45 USD. v1 yolunda <2.0 ATR yapisal stoplu setuplar REDDEDILIR (~%16).
  max_sl_atr: 5.0                 # 2026-07-26 DOGRULANDI (degistirme): gercek journal TP seviyeleriyle cap5 > cap6 > cap99, her iki yolda da. REJECT semantigi (clamp degil).
  # H3: true → a wide SL (sl_atr_mult > max_sl_atr) is a HARD REJECT
  # (matches v2 SLTooFarError) instead of warn-only.
  # 2026-07-26 (operatör onayı, BT-22): false→true. V1 yolu zaten GERÇEK ATR
  # kullanıyor (safe_orchestrator.py:1517, intent._atr — Wilder'ın 0.96-0.99
  # katı), yani tavan doğru ölçekteydi ama sadece UYARI üretiyordu. V2 tarafını
  # v2_use_real_atr kapatıyor; bu satır aynı deliği V1 tarafında kapatıyor.
  # Beklenen: girişlerin ~1/3'ü reddedilecek. Rejection oranı ilk 48 saatte
  # izlenecek — "SL too wide" log satırı say.
  reject_wide_sl: true

  emergency_balance_threshold: 1216   # Bakiye $1216 altı → HALT (~%10.8 kayıp, $1363 cüzdana göre). 2026-07-09 düzeltme.
  reserve_balance: 0                   # Tüm bakiye kullanılabilir

  min_seconds_between_symbol_fetches: 0.5

  # Entry-drift guard (2026-05-31 incident): signal entry bir bar-close'a çapalı,
  # market fill ise canlı fiyat. Canlı fiyat signal'den bu %'den fazla kaçmışsa
  # VEYA zaten TP1'i geçmişse giriş REDDEDİLİR (yoksa pozisyon SL-only kalır,
  # TP Binance -2021 ile reddedilir). 0 = kapalı. Gevşetmek/sıkmak operatör kararı.
  max_entry_drift_pct: 1.0

  # ── PnL reconcile audit (PR C, 2026-06-01) ──
  # Periodic sweep that corrects locally-estimated closes to Binance net
  # realizedPnl (realizedPnl - commission - funding). Runs once per N reconcile
  # cycles. Fixes the local-vs-exchange PnL divergence (+87 local vs +32 real).
  enable_pnl_audit: true
  pnl_audit_every_cycles: 20
  # M4 (default OFF): true → the PnL-audit sweep re-feeds sign-flipped corrections
  # to the breaker's consecutive-loss counter (a sign-flipped estimate can wrongly
  # RESET it). Fail-CLOSED (can only trip earlier). Flip true after risk-ops sign-off.
  breaker_backcorrect_consecutive: false

  # ── SL/TP post-placement verify (PR B, 2026-06-01) ──
  # After entry fills + SL/TP placed, re-query the exchange ~2.5s later to
  # confirm the protection orders actually landed; repair missing legs. If SL
  # can't be confirmed after N attempts → market-close (never hold bare). If
  # only TP is missing → tolerate + let reconcile keep retrying.
  enable_post_placement_verify: true
  verify_delay_sec: 2.5
  verify_max_attempts: 3
  rollback_on_sl_failure: true

  # ── Safety Integration (2026-05-30 plan) ──
  reverse_min_profit_pct: 0.2          # kontra sinyal: karda + %0.2 buffer üstünde reverse
  pause_new_entries: false             # true = yeni giriş durdur (mevcut pozisyonlar yönetilir)
  orphan_protection:
    enabled: true                      # borsa-yetim pozisyona otomatik SL
    mode: place_missing_sl
    default_sl_pct: 2.0
    max_auto_protect_per_cycle: 1
    min_distance_to_mark_pct: 0.5
    require_tp_present: false           # TP'siz çıplak pozisyon EN risklisi → koru

signal_ledger:
  enabled: false            # master flag, decoupled from kronos.*
  fill_window_bars: 8       # bars after emission for MARKET-at-confirmation, else 'unfilled'
  max_horizon_hours: 48     # SL/TP race expiry
  resolution_tf: "1m"       # resolver kline granularity
  resolver_cadence_sec: 300 # batch pass interval
  max_symbols: 25           # per-pass open-signal cap (weight budget)
  fetch_fail_alert_pct: 20  # AlertRouter breach threshold (% of pass)

# S2 (2026-07-25): NET-cost backtest. Bu blok yokken backtest/engine.py:324
# default 0.0'a duser ve TUM backtestler BRUT kosar -> gate'in "NET" kismi hic
# calismaz. W2 A/B kosusu tam bu yuzden gecersizdi: brutte +0.045R, nette
# -0.015R (komisyon+funding avantajin tamamini yiyor).
backtest:
  commission_pct: 0.04        # Binance USD-M taker, TEK bacak (round-trip 0.08%)
  funding_pct_per_8h: 0.01    # ortalama simetrik drag (metrics.apply_funding_costs)
