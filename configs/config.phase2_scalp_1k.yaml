# ══════════════════════════════════════════════════════════════════
# BOT V3 — SCALP profil (5m/1h/12h) — Fibonacci-aware TP/SL v3 (cüzdan ~$525)
# ══════════════════════════════════════════════════════════════════
# Bu, V1 (mid 15m/1h/4h) ve V2 (long 1h/8h/1w) yanında AYNI Hetzner
# VPS'te paralel çalışan ÜÇÜNCÜ bot'tur (container: efloud-bot-scalp,
# domain: scalp.u2algo.com, EFLOUD_BOT_ID=v3-scalp, state_dir: ./state_scalp).
# 2026-07-04: config/per-mode-sizing PARK branch'inden master'a alındı (operatör onayı:
# ONE-WAY + 3x/$50 kademeli sizing). Mid/long config'lerine dokunulmadı.
# Kendi ayrı Binance sub-account'ı (kendi API key + izole futures cüzdanı).
# Gerçek bakiye: ~$525 USDT (2026-07-09, operatör Binance app'ten doğruladı).
# 2026-07-08 (C2 re-recalibration, GERİ ALINDI 2026-07-09): O gün V1+V2+V3'ün
# TEK ortak cüzdanı paylaştığı YANLIŞ varsayımıyla starting_balance 500→283
# düşürülmüştü. 2026-07-09'da her botun ayrı sub-account'ta olduğu doğrulandı
# → starting_balance gerçek bakiyeye (525) göre DÜZELTİLDİ. "fixed" sizing modu
# (aşağıda) gerçekten aktif — engine/safe_orchestrator.py + risk/__init__.py
# calc_fixed_position_size() ile bağlı (2026-07-09 VPS→GitHub sync, commit
# 9ff0624), docker loglarıyla doğrulandı ("✅ fixed sizing active: margin=$50
# per coin, leverage=3x, notional=$150.00 per position").
#
# ── SCALP v3 FİBER TP/SL İYİLEŞTİRMESİ ──
#   PROBLEM (mid/long bot'larda tespit edildi):
#     1. Trend TP1=1.5R, TP2=1.618R → fark sadece 0.118R (çok yakın!)
#     2. Range TP1=EQ(0.5), TP2=extreme → dar range'de çok yakın
#     3. Entry-SL makası geniş, Entry-TP dar → kötü risk/ödül
#
#   ÇÖZÜM (scalp v3):
#     1. ext_tp2: 1.618 → 2.618 (TP2 well beyond TP1 in trending)
#     2. range_tp1_fib: 0.5 → 0.618 (TP1 at golden ratio, EQ değil)
#     3. range_tp2_fib: 1.0 (range extreme — değişmedi)
#     4. min_tp_gap_r: 0.5 (TP1→TP2 arası EN AZ 0.5R olmalı)
#     5. sl_atr_buffer: 0.5 → 0.3 (daha sıkı stop, makas daraltıldı)
#     6. TP1 hit → SL entry'ye taşınır (breakeven), eski SL silinir (mevcut)
#
# Risk profili — SCALP AGRESIF-KONTROLLÜ:
#   Cüzdan:           ~$525 (2026-07-09 düzeltme; kendi izole Binance sub-account'ı) — YENİDEN DOĞRULA
#   Kaldıraç:         5x (exchange.leverage; 2026-07-24 operatör talebi, WAS 3x)
#   Sizing modu:      FIXED — $50 margin/coin × 5x = $250 notional/pozisyon (2026-07-24, WAS $150 @ 3x)
#   Eşzamanlı max:    10 pozisyon
#   min_rr:           1.0 (scalp hızlı kar alır)
#   min_confluence:   55
#   Max tutuş:        4 saat (scalp = kısa tutuş)
#   ⚠️ Scalp profili backtest-EDİLMEDİ; judgment-based başlangıç.
#
# 2026-07-24 (operatör talebi): kaldıraç 3x→5x. fixed_position_usdt ($50)
# DEĞİŞMEDİ → notional $150→$250. TÜRETİLMİŞ guard güncellemesi: aşağıdaki
# safety.max_total_exposure 4.0→6.0 (10×$250=$2500 ≈ cüzdanın 4.76x'i; eski 4.0
# cap ~8. pozisyonda keserdi). max_position_notional_pct (35.0) DEĞİŞMEDİ (guard
# margin $50'ye bakar, kaldıraçtan etkilenmez). Scalp'in kısa tutuşu (max_holding_
# hours=4, max_sl_atr=3.0 — en sıkı üç profil arasında) likidasyon-mesafesi
# daralmasını (~%33→~%20) kısmen telafi eder ama ortadan kaldırmaz. ÖNEMLİ:
# mevcut açık pozisyon varken restart+Start yapılırsa set_leverage YENİDEN
# gönderilir, pozisyonun likidasyon fiyatı yeniden hesaplanır — restart öncesi
# dashboard'da Positions'ın boş (flat) olduğunu doğrula.
#
# Çalıştırmak için (lokal test):
#   python main.py configs/config.phase2_scalp_1k.yaml
#
# VPS'de (efloud-bot-scalp container, .env.production.scalp):
#   EFLOUD_CONFIG_PATH=configs/config.phase2_scalp_1k.yaml
#
# V1/V2 ile FARK: timeframes.profile (scalp), fibonacci params, risk/safety
# tuning, state/reports/log path'leri (_scalp). Diğer her şey V1 ile paralel.

exchange:
  name: binance
  market_type: futures
  api_key: ""              # VPS env: BINANCE_API_KEY (scalp cüzdan key)
  api_secret: ""           # VPS env: BINANCE_API_SECRET (scalp cüzdan secret)
  testnet: false           # MAINNET
  leverage: 5              # 2026-07-24 operatör talebi: 3x→5x (WAS 3x "kademeli sizing (düşük-risk scalp)")
  margin_mode: ISOLATED    # per-symbol risk isolation
  hedge_mode: false        # ONE-WAY (operatör kararı 2026-07-04): V1/V2 duruşuyla tutarlı,
                           # test edilmiş yol. Branch tasarımı hedge idi; scalp cüzdanı yeni
                           # olsa da mod savaşı riskine karşı one-way ile başlıyoruz.

# ── SMC v2 feature flag ──
engine:
  smc_version: v2
  # LIVE (operatör onayı 2026-07-07): explicit whitelist = symbols.fixed_core
  # (aşağıda) + shadow:false. "*" LIVE'da reddedilir (H2, safe_orchestrator.py).
  smc_v2_symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT", "BNB/USDT", "XRP/USDT",
                   "DOGE/USDT", "TRX/USDT", "LINK/USDT", "AVAX/USDT", "ADA/USDT"]
  smc_v2_shadow: false     # LIVE (operatör onayı 2026-07-07): gerçek emir

# ── 10 majör sembol (scalp için yüksek likidite) ──
symbols:
  mode: fixed
  fixed_core:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
    - DOGE/USDT
    - TRX/USDT
    - LINK/USDT
    - AVAX/USDT
    - ADA/USDT
  dynamic_top_n: 0
  dynamic_exclude: []
  refresh_dynamic_hours: 24

timeframes:
  # SCALP profile: 5m entry, 1h mtf (SMC yapı), 4h htf (trend) — operatör 2026-07-06
  # Hızlı sinyal, kısa tutuş. Profil değiştirmeden ÖNCE flat ol + restart.
  profile: scalp
  htf: 4h          # custom/fallback (profile=scalp zaten override eder)
  mtf: 1h
  entry: 5m
  kline_limit: 500

structure:
  swing_lookback: 4             # Scalp: daha kısa lookback (4-mum swing)
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

# ═══ FİBER TP/SL — SCALP v3 İYİLEŞTİRMESİ (ANA DEĞİŞİKLİK) ═══
fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 2.618           # WAS 1.618 → TP2 çok daha uzak (trend durumunda TP1-TP2 gap düzeldi)
  # ── Scalp v3 NEW: Range Fibonacci TP targeting ──
  range_tp1_fib: 0.618     # TP1 range'in %61.8'inde (EQ/0.5 yerine — daha derin kar)
  range_tp2_fib: 1.0       # TP2 range ekstremi (değişmedi)
  min_tp_gap_r: 0.5        # TP1→TP2 arası EN AZ 0.5R (scalp için yeterli mesafe)

# ── Risk: SCALP v3.1 tuning — SMC block targeting + blended R:R ──
risk:
  risk_per_trade_pct: 1.0             # ~$10 risk budget per trade
  max_open_positions: 10              # 10 × $50 marjin = $500 (tam cüzdan; operatör 2026-07-04)
  min_rr: 1.0                         # Legacy min_rr (SMC targeting OFF fallback)
  min_confluence: 55
  recency_bars: 40
  sl_atr_buffer: 0.3                  # Daha sıkı stop (makas daraltıldı)
  daily_filter_strict: false

  position_size_calculation: fixed   # Fixed $50 margin per coin İSTENDİ. 2026-07-09 GÜNCELLEME:
                                      # artık gerçekten AKTİF — VPS-local engine/safe_orchestrator.py
                                      # + risk/__init__.py calc_fixed_position_size() ile bağlandı
                                      # (2026-07-09 VPS→GitHub sync, commit 9ff0624); docker
                                      # loglarında "✅ fixed sizing active: margin=$50 per coin,
                                      # leverage=3x, notional=$150.00 per position" ile doğrulandı.
  fixed_position_usdt: 50             # $50 margin × 5x = $250 notional/pozisyon — AKTİF (2026-07-24: kaldıraç 3x→5x, WAS $150 @ 3x)
  max_loss_per_trade_usdt: 10
  target_stop_distance_pct: 3

  # 2026-07-09 (düzeltildi): V1/V2/V3 TEK ortak cüzdanı paylaşıyor varsayımı
  # YANLIŞTI — her botun kendi ayrı sub-account'ı var. Ayrıca bu bot "fixed"
  # sizing modunda olduğu için sizing_balance_source zaten HİÇ kullanılmıyor
  # (calc_fixed_position_size balance almaz) — bu ayar şu an İNERT, "legacy"
  # moda geçilirse diye zararsızca bırakıldı.
  sizing_balance_source: available

  # ═══ SCALP v3.1: SMC Block Targeting + Blended R:R ═══
  # TP1/TP2 artık gerçek SMC yapılarında (OB/FVG/liq/swing), fib değil.
  # Blended R:R: (0.5 × TP1_R + 0.5 × TP2_R) >= blended_rr_target
  smc_tp_targeting: true        # true = SMC block TP targeting aktif
  min_rr_tp1: 0.5               # TP1 min R:R (düşük → ilk yapıya yakın, TP2'yi zorla)
  blended_rr_target: 1.5        # Hedef blended R:R (TP1+TP2 ortalaması)

operation:
  check_interval_sec: 15              # Scalp: daha sık kontrol (15s vs 30s)
  dry_run: false                      # ⚠️ GERÇEK ORDER (önce AUTOSTART=0, validate, sonra Start)
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_scalp.log
  state_dir: ./state_scalp
  reports_dir: ./reports_scalp

# ── Advisory LLM backend — V1 ile aynı ──
llm:
  provider: minimax
  model: MiniMax-M2.7-highspeed

# ── Kronos advisory layer — V1 ile aynı: OFF ──
kronos:
  enabled: false
  run_on: [trade_open]
  data_source: yfinance
  interval: "1h"
  period: "1mo"
  pred_len: 12
  max_concurrency: 1
  cooldown_sec: 3600
  synth_timeout_sec: 30
  prewarm_on_start: true
  show_numeric_confidence: false

# ── Safety: SCALP tuning ──
safety:
  daily_loss_limit_pct: 8.0           # Scalp: daha sıkı günlük limit (%8 vs %10)
  weekly_drawdown_limit_pct: 15.0     # Scalp: daha sıkı haftalık DD (%15 vs %25)
  consecutive_loss_limit: 3
  consecutive_pause_min: 90           # Scalp: daha kısa pause (90dk vs 120dk)
  starting_balance: 525               # 2026-07-09 düzeltme: kendi izole Binance sub-account bakiyesi. Bkz. dosya başı.

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5
  regime_ml_can_override_gate: false

  # max_position_notional_pct: position_guard.can_open_position içinde MARGIN cap'i
  # (margin=$50 ≤ balance×pct/100) — calc_fixed_position_size bu alanı kullanmaz
  # ama guard HER modda uygular, İNERT değil (bkz. dosya başı 2026-07-24 notu).
  # $50 marjin / ~$525 bakiye ≈ %9.5 — 35.0 geniş tampon, kaldıraçtan etkilenmez.
  max_position_notional_pct: 35.0     # guard margin-cap tamponu (gerçek kullanım ~%9.5)
  # 2026-07-24: 4.0→6.0 — kaldıraç 3x→5x ile notional $150→$250 oldu:
  # 10 × $250 = $2500 / $525 ≈ 4.76x. Eski 4.0/2.9x tamponu artık yetersizdi
  # (~8. pozisyonda yeni girişi keserdi).
  max_total_exposure: 6.0             # 10×$250 (5x) desteklemek için yükseltildi (WAS 4.0)
  max_holding_hours: 4                # SCALP: max 4 saat tutuş (V1=24, V2=168)
  max_pyramid_adds: 0
  min_sl_atr: 0.3                     # Scalp: daha sıkı min SL (0.3 vs 0.5)
  max_sl_atr: 3.0                     # Scalp: daha sıkı max SL (3.0 vs 5.0)
  reject_wide_sl: false

  emergency_balance_threshold: 472    # Bakiye $472 altı → HALT (~10% kayıp, $525 cüzdana göre). 2026-07-09 düzeltme.
  reserve_balance: 0

  min_seconds_between_symbol_fetches: 0.5
  max_entry_drift_pct: 1.0

  # PnL reconcile — V1 ile aynı
  enable_pnl_audit: true
  pnl_audit_every_cycles: 20
  breaker_backcorrect_consecutive: false

  # SL/TP verify — V1 ile aynı
  enable_post_placement_verify: true
  verify_delay_sec: 2.5
  verify_max_attempts: 3
  rollback_on_sl_failure: true

  # Safety Integration — V1 ile aynı
  reverse_min_profit_pct: 0.2
  pause_new_entries: false
  orphan_protection:
    enabled: true
    mode: place_missing_sl
    default_sl_pct: 2.0
    max_auto_protect_per_cycle: 1
    min_distance_to_mark_pct: 0.5
    require_tp_present: false

signal_ledger:
  enabled: false
  fill_window_bars: 8
  max_horizon_hours: 48
  resolution_tf: "1m"
  resolver_cadence_sec: 300
  max_symbols: 25
  fetch_fail_alert_pct: 20
