# ══════════════════════════════════════════════════════════════════
# FAZ 2 — Mainnet LIVE Trading (küçük bakiye)
# ══════════════════════════════════════════════════════════════════
# ⚠️  GERÇEK PARA RİSKİ  ⚠️
#
# Bu config:
#   ✓ Gerçek Binance mainnet
#   ✓ Gerçek order gönderir
#   ⚠️  Fonlar risk altında
#
# Önkoşullar:
#   1. Faz 1'i min 3 gün çalıştırdın ve sinyal kalitesi iyi göründü
#   2. Binance hesabına SADECE $100-200 transfer ettin (fazla değil!)
#   3. API key "Enable Futures" yetkisi var (Withdrawals KAPALI olsun)
#   4. 2FA aktif, IP whitelist set
#   5. EFLOUD_ALLOW_MAINNET=1 env var ayarlı
#
# Çalıştırmak için:
#   $env:EFLOUD_ALLOW_MAINNET = "1"
#   python main.py configs/config.phase2.yaml

exchange:
  name: binance
  market_type: futures
  api_key: ""
  api_secret: ""
  testnet: false           # MAINNET
  leverage: 3              # Düşük leverage — Faz 2'de risk minimize
  margin_mode: ISOLATED    # Risk yalıtımı: pozisyonlar birbirini etkilemez (kritik!)

# ── Symbol universe ──
symbols:
  mode: fixed
  fixed_core:
    - BTC/USDT
    - ETH/USDT
    - XRP/USDT
    - BNB/USDT
    - SOL/USDT
    - TRX/USDT
    - DOGE/USDT
    - ADA/USDT
    - BCH/USDT
    - LINK/USDT
    - ZEC/USDT
    - LTC/USDT
    - AVAX/USDT
    - DOT/USDT
    - TON/USDT
    - NEAR/USDT
    - ATOM/USDT
    - APT/USDT
    - UNI/USDT
    - ICP/USDT
  dynamic_top_n: 0
  dynamic_exclude:
    - USDC/USDT
    - FDUSD/USDT
  refresh_dynamic_hours: 24

# ── Timeframe chain — 4 TF Efloud yapısı ──
# Daily (1d) makro filter: STRICT mode — 1d ters yön → sinyal reddedilir
timeframes:
  htf: 4h
  mtf: 1h
  entry: 15m
  kline_limit: 500

# ── Structure ──
structure:
  swing_lookback: 5
  ob_sequential: 5
  body_mode: true
  eq_threshold_pct: 0.1
  range_lookback: 50

# ── Fibonacci ──
fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk — FAZ 2 için $2000 bakiyesinde SIKI ayar ──
# Hedef: 1 hafta test penceresinde max $100 kayıp riski
risk:
  risk_per_trade_pct: 0.25         # $2000 × 0.25% = $5 risk per trade (çok sıkı)
  max_open_positions: 4
  min_rr: 1.8
  min_confluence: 65                # Faz 2 kalite eşiği
  recency_bars: 40
  sl_atr_buffer: 0.5
  daily_filter_strict: true        # 1d ters yön → komple reddet

# ── Operation ──
operation:
  check_interval_sec: 30
  dry_run: false                    # ⚠️ GERÇEK ORDER
  watch_only: false
  symbol_scan_mode: sequential
  parallel_workers: 3
  log_level: INFO
  log_file: ./logs/efloud_phase2.log
  state_dir: ./state_phase2
  reports_dir: ./reports_phase2

# ── Safety — $2000 bakiye, max $100 hafta riski ──
safety:
  daily_loss_limit_pct: 1.5         # $30 günlük max kayıp (çok sıkı)
  weekly_drawdown_limit_pct: 5.0    # $100 haftalık max drawdown → HALT
  consecutive_loss_limit: 2          # 2 ardışık SL → 3 saat pause
  consecutive_pause_min: 180
  starting_balance: 2000             # GERÇEK BAKİYE

  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5

  max_position_notional_pct: 1.0    # Tek pozisyon max $20 margin (= $60 notional 3x'te)
  max_total_exposure: 1.5            # Toplam notional max $3000 (bakiyenin 1.5x'i)
  max_holding_hours: 24              # 24 saat üzeri pozisyon → forced close uyarısı
  max_pyramid_adds: 1                # Pyramid: max 1 ekleme (riski sınırla)
  min_sl_atr: 0.5
  max_sl_atr: 5.0

  # ── v2.2.0 yeni alanları ──
  # Emergency: bakiye $1900 altına düşerse HALT (%5 toplam kayıp = $100)
  emergency_balance_threshold: 1900
  # Reserve: $200 dokunulmaz (funding fee, exchange fee, buffer)
  reserve_balance: 200

  min_seconds_between_symbol_fetches: 0.5
