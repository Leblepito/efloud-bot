# ══════════════════════════════════════════════════════════════════
# Efloud SMC Bot v2.1 — Configuration
# ══════════════════════════════════════════════════════════════════
# Environment variables (env > config, güvenli kullanım):
#   BINANCE_API_KEY
#   BINANCE_API_SECRET
#   EFLOUD_ALLOW_MAINNET=1  (mainnet LIVE için zorunlu)

exchange:
  name: binance
  market_type: futures
  api_key: ""              # Prefer env var BINANCE_API_KEY
  api_secret: ""           # Prefer env var BINANCE_API_SECRET
  testnet: true            # İlk testlerde true bırak
  leverage: 5              # PR A: 3 -> 5 for consistency with active prod config
  margin_mode: ISOLATED    # PR A: was CROSSED — per-symbol risk isolation
  hedge_mode: false        # PR A: was true — ONE-WAY; Binance blocks long+short on one symbol

# ── SMC v2 feature flag (PR #S6) ──
# Inert default: smc_version=v1, smc_v2_symbols=[] → v1 path active, v2 dormant.
# Shadow rollout: set smc_version=v2 + smc_v2_symbols=["*"] + smc_v2_shadow=true
#   → v2 signals computed and logged to logs/smc_v2_shadow.log, NO orders placed.
# Live v2 (Hermes-only): set smc_v2_shadow=false. Per-symbol opt-in via
# smc_v2_symbols=["ETH/USDT","BTC/USDT",...] for phased rollout.
engine:
  smc_version: v1               # "v1" | "v2"
  # Whitelist gates EXECUTION only — v2 state machine still runs upstream
  # when smc_version=v2, but no order is placed unless symbol is whitelisted.
  smc_v2_symbols: []            # ["*"] = all symbols, [] = no execution
  smc_v2_shadow: false          # true = log v2 signal, skip order placement

# ── SMC v2 tunables (PR #S6) ──
# Active only when engine.smc_version == "v2". Defaults match parent spec §9.
smc_v2:
  pullback_timeout_bars: 8      # 15m bars (~2h until SetupCandidate expires)
  fvg_priority: true            # FVG before OTE for zone selection
  ote_band: [0.618, 0.786]      # OTE fib levels for fallback zone
  require_confirmation: true    # 15m CHoCH/engulfing inside zone before entry
  max_pending_per_symbol: 3     # SetupCandidate cap per symbol

# ── Symbol universe ──
# 20 coin SABIT liste — bot hep aynı coinler üzerinde öğrensin
# Dinamik refresh kapalı, stabil karakter için.
symbols:
  mode: fixed                   # Sabit liste, dinamik değişim yok
  fixed_core:
    # ── Majors (market cap top) ──
    - BTC/USDT
    - ETH/USDT
    - XRP/USDT
    - BNB/USDT
    - SOL/USDT
    # ── Established L1 / utility ──
    - TRX/USDT
    - DOGE/USDT
    - ADA/USDT
    - BCH/USDT
    - LINK/USDT
    # ── Top mid-caps ──
    - ZEC/USDT
    - LTC/USDT
    - AVAX/USDT
    - DOT/USDT
    - TON/USDT
    # ── Active L1 / DeFi ──
    - NEAR/USDT
    - ATOM/USDT
    - APT/USDT
    - UNI/USDT
    - ICP/USDT
  # Fixed mode'da gerekli değil ama ileride hybrid'e dönerse kalsın:
  dynamic_top_n: 0
  dynamic_exclude:
    - USDC/USDT
    - FDUSD/USDT
    - TUSD/USDT
    - DAI/USDT
    - BUSD/USDT
  refresh_dynamic_hours: 24

# ── Timeframe chain — 4 TF (Daily makro filter dahil) ──
# 1d makro yön filtresi olarak kullanılır:
#   - Confluence skoruna ±5 puan etkisi
#   - daily_filter_strict: true ise ters yön sinyali tamamen reddedilir
timeframes:
  htf: 4h                       # High — bias
  mtf: 1h                       # Mid — confirmation
  entry: 15m                    # Entry
  kline_limit: 500

# ── Structure ──
structure:
  swing_lookback: 4             # Min 4 (Efloud 4-mum) (Optimized from 5)
  ob_sequential: 5
  body_mode: true               # Kripto = body
  eq_threshold_pct: 0.1
  range_lookback: 50

# ── Fibonacci ──
fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk ──
risk:
  risk_per_trade_pct: 2.0         # 20 coin için düşürüldü (risk dağılımı) (Optimized from 0.75)
  max_open_positions: 20             # Aynı anda max 20 pozisyon (hedge mode için)
  min_rr: 1.5                       # R:R 1:1.5 minimum — TP1 mantığı düzeltildi (signals.py) (Optimized from 1.8)
  min_confluence: 55                # 55'te: HTF+MTF+OB+OTE gibi 4 konsept bir arada = ~65 puan
                                    # Tek başına HTF+MTF (45 puan) yetmez — multi-concept zorunlu
  recency_bars: 40                   # Sinyal tazelik penceresi (son N bar'daki CHoCH'ları değerlendirir)
                                    # 20 → 40 = daha geniş kapsama, daha çok sinyal yakalar
  sl_atr_buffer: 0.5
  daily_filter_strict: false       # 4. TF (1d) filter — false = soft (±5 conf bonus)
                                    #                     true  = strict (ters yön → reddet)

  # ── Opt-in: reverse-from-risk position sizing (cherry-picked from v2.2.0) ──
  # "legacy"            → mevcut risk.calc_position_size (ATR + risk_pct tabanlı)
  # "reverse_from_risk" → CustomRiskCalculator: position_size = max_loss / (stop_dist * leverage)
  position_size_calculation: legacy
  max_loss_per_trade_usdt: 10        # reverse_from_risk modu için: trade başı max kayıp USDT
  target_stop_distance_pct: 5         # reverse_from_risk modu için: hedef stop mesafesi (%)

# ── Operation ──
operation:
  check_interval_sec: 30
  dry_run: true                     # İlk canlıda mutlaka true bırak
  watch_only: false                  # true = sadece analiz, trade yok
  symbol_scan_mode: sequential       # "sequential" | "parallel"
  parallel_workers: 3                # parallel seçilirse max thread
  log_level: INFO
  log_file: ./logs/efloud_bot.log
  state_dir: ./state
  reports_dir: ./reports

# ── Safety (v2.1) ──
safety:
  # PnL reconcile audit (PR C, 2026-06-01) — correct estimated closes to
  # Binance net realizedPnl on a periodic reconcile sweep.
  enable_pnl_audit: true
  pnl_audit_every_cycles: 20

  # SL/TP post-placement verify (PR B, 2026-06-01) — confirm protection orders
  # landed within seconds of entry; market-close if SL unconfirmable.
  enable_post_placement_verify: true
  verify_delay_sec: 2.5
  verify_max_attempts: 3
  rollback_on_sl_failure: true

  # Circuit Breaker
  daily_loss_limit_pct: 3.0
  weekly_drawdown_limit_pct: 8.0
  consecutive_loss_limit: 3
  consecutive_pause_min: 120
  starting_balance: 10000

  # Regime Detection
  adx_trend_threshold: 25
  adx_range_threshold: 20
  volatile_atr_mult: 2.5

  # Position Guards — 20 coin için sıkılaştırılmış
  max_position_notional_pct: 8.0    # Tek trade max %8 (Optimized from 3.0)
  max_total_exposure: 3.0            # Toplam notional < 3x balance (konservatif)
  max_holding_hours: 48
  max_pyramid_adds: 2
  min_sl_atr: 0.5
  max_sl_atr: 5.0

  # Reverse-on-profit guard: when an opposite-direction signal arrives on a
  # symbol that already has an open position, only allow flipping if the
  # current unrealized PnL is above this threshold (net %, fee+slippage
  # buffer). Below threshold (or in loss) the signal is rejected — TP or
  # SL must fire first. Default 0.2 ~= taker 0.04% × 2 + slippage 0.1%.
  reverse_min_profit_pct: 0.2

  # ── v2.2.0 yeni alanları ──
  emergency_balance_threshold: null  # null = devre dışı (testnet)
  reserve_balance: 0                  # testnet: 0

  # Pause NEW market entries while keeping reconcile, lifecycle, SL/TP
  # management, breaker updates, and notifications active. Default false.
  # Operator override: EFLOUD_PAUSE_NEW_ENTRIES=true|false (read at startup;
  # container recreate required to apply env changes — `docker compose up -d`,
  # NOT `docker restart`). Production activation requires Hermes/Utku approval.
  pause_new_entries: false

  # Orphan position protection (default off).
  # When enabled, the bot can place close-position STOP_MARKET SL orders
  # for orphan exchange positions (positions on the exchange not in local
  # lifecycle state). This does NOT import orphans into local state.
  # Activation requires Hermes/Utku approval in production.
  orphan_protection:
    enabled: false
    mode: warn_only           # warn_only | place_missing_sl
    default_sl_pct: 2.0
    max_auto_protect_per_cycle: 1
    min_distance_to_mark_pct: 0.5
    require_tp_present: true

  # Per-symbol rate limiting
  min_seconds_between_symbol_fetches: 0.5   # 20 coin için daha sıkı ritim

# ── Runtime Agent Team (canonical Part A) ──
# Advisory LLM layer. Default: enabled but GATING OFF → shadow mode only.
# The team reviews every signal and writes a verdict to state/agent_disagreements.jsonl,
# but the deterministic guard/breaker pipeline is NOT modified. Set
# `gating: true` only after a shadow-mode observation period has built
# confidence in the verdicts.
#
# NOTE — `min_team_score` was removed in the push-prep fixup: it was a dead
# config (never read). A weighted-arbitration policy that uses a score
# threshold will land in a follow-up PR, with tests.
#
# NOTE — `post_mortem.schedule` is a label only. The bot has no built-in
# cron/scheduler; post-mortem is triggered manually via
# `POST /api/ai/post-mortem?schedule=daily|weekly` or by operator tooling.
agent_team:
  enabled: true          # team runs (verdicts are logged + persisted)
  gating: false          # REJECT does NOT block the signal (shadow)
  model: gemini-3.5-flash
  post_mortem:
    enabled: true
    # schedule: API-tetiklemeli (POST /api/ai/post-mortem). Bot içinde
    # cron/scheduler YOK. 'daily' | 'weekly' yalnızca prompt framing'i
    # için kullanılır.

# ── Kronos advisory layer (time-series forecast + LLM synthesis) ──────────────
# ADDITIVE & ADVISORY-ONLY: commentary + categorical band for Telegram/DB.
# NEVER feeds trade/sizing/SL-TP/confluence logic. DEFAULT-OFF kill switch.
# Provider resolved via make_llm_client (falls back to agent_team / LLM_PROVIDER).
# Pre-warm before first enable:
#   python external_repos/kronos-claude-skill/scripts/run_kronos.py BTC-USD 1mo 1h 12
kronos:
  enabled: false              # MASTER kill switch. false → fully inert.
  run_on: [trade_open]        # subset of [trade_open, readonly]; readonly = whole-universe fan-out (opt-in).
  data_source: yfinance       # yfinance (spot, default/works today) | binance (perp klines — code-ready,
                              #   but requires the PATCHED skill deployed (external_repos is gitignored) +
                              #   a parquet engine in the sub-venv. Keep yfinance until that's provisioned.)
  interval: "1h"
  period: "1mo"
  pred_len: 12
  max_concurrency: 1          # dedicated bounded executor + Semaphore
  cooldown_sec: 3600          # per (symbol,direction,bar) dedup window
  synth_timeout_sec: 30
  prewarm_on_start: true
  show_numeric_confidence: false  # false → categorical band (no fake 0-100 next to confluence)

# ── Customer notifications (T-018, P-003 W3) ──
# SCHEMA + EXAMPLE ONLY — this block is inert by default and the live prod config
# (configs/config.phase2_1k.yaml) is NOT changed by this PR. Flipping `enabled`
# in production is a separate operator-gated commit AFTER a customer cohort exists
# (depends on T-016) and risk/legal sign-off.
#
# The customer channel is the PUBLIC u2algo Telegram channel. It posts a once-daily
# AGGREGATE digest of CLOSED trades only (count / win-rate / aggregate return) — no
# per-trade entry/SL/TP, no real-time signal — to stay clear of the "signal service"
# regulatory line. It uses SEPARATE credentials from the operator alerter
# (EFLOUD_CUSTOMER_TG_* vs EFLOUD_TELEGRAM_*) and never touches the trading loop.
notifications:
  telegram:
    enabled: false            # MASTER switch. false → fully inert (zero HTTP).
    mode: daily_digest        # only implemented (and regulation-safe) mode
    # Credentials live ONLY in the deploy env (never in repo):
    #   EFLOUD_CUSTOMER_TG_TOKEN, EFLOUD_CUSTOMER_TG_CHANNEL_ID
    #   (optional) EFLOUD_CUSTOMER_TG_THREAD_ID, EFLOUD_CUSTOMER_TG_PARSE_MODE
