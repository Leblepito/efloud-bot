# ══════════════════════════════════════════════════════════════════
# Efloud SMC Bot v2.1 — Configuration
# ══════════════════════════════════════════════════════════════════
# Environment variables (env > config, güvenli kullanım):
#   BINANCE_API_KEY
#   BINANCE_API_SECRET
#   EFLOUD_ALLOW_MAINNET=1  (mainnet LIVE için zorunlu)

exchange:
  name: binance
  market_type: futures
  api_key: ""
  api_secret: ""
  testnet: false           # CHANGED: Default to mainnet (use Phase 1 config for testing)
  leverage: 3
  margin_mode: isolated    # NEW: Force isolated margin for safety

# ── Symbol universe ──
# 20 coin SABIT liste — bot hep aynı coinler üzerinde öğrensin
# Dinamik refresh kapalı, stabil karakter için.
symbols:
  mode: fixed                   # Sabit liste, dinamik değişim yok
  fixed_core:
    # ── Majors (market cap top) ──
    - BTC/USDT
    - ETH/USDT
    - XRP/USDT
    - BNB/USDT
    - SOL/USDT
    # ── Established L1 / utility ──
    - TRX/USDT
    - DOGE/USDT
    - ADA/USDT
    - BCH/USDT
    - LINK/USDT
    # ── Top mid-caps ──
    - ZEC/USDT
    - LTC/USDT
    - AVAX/USDT
    - DOT/USDT
    - TON/USDT
    # ── Active L1 / DeFi ──
    - NEAR/USDT
    - ATOM/USDT
    - APT/USDT
    - UNI/USDT
    - ICP/USDT
  # Fixed mode'da gerekli değil ama ileride hybrid'e dönerse kalsın:
  dynamic_top_n: 0
  dynamic_exclude:
    - USDC/USDT
    - FDUSD/USDT
    - TUSD/USDT
    - DAI/USDT
    - BUSD/USDT
  refresh_dynamic_hours: 24

# ── Timeframe chain — 4 TF (Daily makro filter dahil) ──
# 1d makro yön filtresi olarak kullanılır:
#   - Confluence skoruna ±5 puan etkisi
#   - daily_filter_strict: true ise ters yön sinyali tamamen reddedilir
timeframes:
  htf: 4h                       # High — bias
  mtf: 1h                       # Mid — confirmation
  entry: 15m                    # Entry
  kline_limit: 500

# ── Structure ──
structure:
  swing_lookback: 5             # Min 4 (Efloud 4-mum)
  ob_sequential: 5
  body_mode: true               # Kripto = body
  eq_threshold_pct: 0.1
  range_lookback: 50

# ── Fibonacci ──
fibonacci:
  ote_lower: 0.618
  ote_upper: 0.786
  ext_tp2: 1.618

# ── Risk ──
risk:
  # NEW: Risk calculation method
  position_size_calculation: "reverse_from_risk"  # "reverse_from_risk" | "legacy_percentage"

  # NEW: Reverse calculation parameters
  max_loss_per_trade_usdt: 20.0        # Max acceptable loss per trade
  target_stop_distance_pct: 10.0       # Target stop loss distance (10%)

  # Existing parameters (still used)
  starting_balance: 1000               # Updated to actual balance
  max_open_positions: 4                # Reduced for smaller portfolio
  min_rr: 2.0

  # Legacy parameters (for backwards compatibility)
  risk_per_trade_pct: 0.75            # Only used if position_size_calculation != "reverse_from_risk"

  min_confluence: 55                # 55'te: HTF+MTF+OB+OTE gibi 4 konsept bir arada = ~65 puan
                                    # Tek başına HTF+MTF (45 puan) yetmez — multi-concept zorunlu
  recency_bars: 40                   # Sinyal tazelik penceresi (son N bar'daki CHoCH'ları değerlendirir)
                                    # 20 → 40 = daha geniş kapsama, daha çok sinyal yakalar
  sl_atr_buffer: 0.5
  daily_filter_strict: false       # 4. TF (1d) filter — false = soft (±5 conf bonus)
                                    #                     true  = strict (ters yön → reddet)

# ── Operation ──
operation:
  check_interval_sec: 30
  dry_run: true                     # İlk canlıda mutlaka true bırak
  watch_only: false                  # true = sadece analiz, trade yok
  symbol_scan_mode: sequential       # "sequential" | "parallel"
  parallel_workers: 3                # parallel seçilirse max thread
  log_level: INFO
  log_file: ./logs/efloud_bot.log
  state_dir: ./state
  reports_dir: ./reports

# Enhanced safety thresholds for smaller portfolio
safety:
  daily_loss_limit_pct: 2.0           # Tighter for smaller balance
  weekly_drawdown_limit_pct: 6.0
  consecutive_loss_limit: 2
  consecutive_pause_min: 60
  starting_balance: 1000              # Updated to actual balance

  # Updated position guards
  max_position_notional_pct: 20.0     # 6.67% position * 3x = 20% max exposure
  max_total_exposure: 2.0             # Max 2x balance total exposure
  min_balance_reserve: 50
  max_holding_hours: 48
  max_pyramid_adds: 2
  min_sl_atr: 0.5
  max_sl_atr: 5.0

  # Updated emergency stops
  emergency_balance_threshold: 950    # 5% total loss emergency stop
  max_single_loss: 25                 # Stop if any position loses > 25 USDT

  min_seconds_between_symbol_fetches: 0.5
