requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "frontend",
    "data",
    "logs",
    "reports",
    "state",
    "state_1k",
    "deploy",
    "scripts",
    "ops",
    "docs",
    "external_repos",
    ".claude",
    ".hermes",
    "u2algo-site",
    "backup_rollout",
]
# Stale CLI scripts at repo root that import the retired backtest.runner module.
# Excluded so pytest discovery doesn't break on import; tracked for follow-up
# cleanup (rename/move under scripts/diag/ or delete).
addopts = [
    "--ignore=test_backtest.py",
    "--ignore=test_backtest_multi.py",
    "--ignore=test_real_backtest.py",
    "--ignore=test_real_data.py",
]

# Shared excludes for the scheduled review/security automations
# (.github/workflows/scheduled-review.yml). Mirrors norecursedirs above.
[tool.ruff]
extend-exclude = [
    ".venv", "venv", ".venv311", "node_modules", "frontend", "data", "logs",
    "reports", "state", "state_1k", "deploy", "scripts", "ops", "docs",
    "external_repos", ".claude", ".hermes", "u2algo-site", "backup_rollout",
    "scratch", "_to_delete", "backup",
]

[tool.bandit]
exclude_dirs = [
    ".venv", "venv", ".venv311", "node_modules", "frontend", "data", "logs",
    "reports", "state", "state_1k", "deploy", "docs", "external_repos",
    ".claude", ".hermes", "u2algo-site", "backup_rollout", "scratch",
    "_to_delete", "tests",
]
