services:
  efloud-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: efloud-bot:latest
    container_name: efloud-bot
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "8080:8080"
    volumes:
      - efloud_state:/app/state
      - efloud_state_1k:/app/state_1k
      - efloud_logs:/app/logs
      - efloud_reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: efloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - efloud-bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  efloud_state:
  efloud_state_1k:
  efloud_logs:
  efloud_reports:
  caddy_data:
  caddy_config:
