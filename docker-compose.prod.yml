services:
  efloud-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: efloud-bot:latest
    container_name: efloud-bot
    restart: unless-stopped
    labels:
      - autoheal=true
    env_file:
      - .env.production
    expose:
      - "8080"  # internal-only; Caddy reverse-proxies via docker network
    volumes:
      - efloud_state:/app/state
      - efloud_state_1k:/app/state_1k
      - efloud_state_aggressive:/app/state_aggressive
      - efloud_logs:/app/logs
      - efloud_reports:/app/reports
      - efloud_content_jobs:/app/data/content_jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 600s window gives the operator time to open the dashboard and press Start
      # when the deploy lands with EFLOUD_AUTOSTART=0 (incident recovery posture).
      # See docs/superpowers/specs/2026-05-15-autostart-friendly-compose-design.md.
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── V2: paralel LONG-profil bot (1h/8h/1w, ~$1112 cüzdan) ──
  # V1 (efloud-bot, mid) yanında AYNI VPS'te ayrı container. İzole state/log/reports
  # volume + kendi .env.production.long'u (V2 Binance key, EFLOUD_BOT_ID=v2-long).
  # Caddy bot.u2algo.com'da servis eder. V1 DOKUNULMAZ. AUTOSTART=0 (manuel start).
  efloud-bot-long:
    image: efloud-bot:latest        # V1'in build ettiği image (ayrı build yok)
    container_name: efloud-bot-long
    restart: unless-stopped
    labels:
      - autoheal=true
    env_file:
      - .env.production.long
    expose:
      - "8080"  # internal-only; Caddy bot.u2algo.com'u proxy'ler
    volumes:
      - efloud_state_long:/app/state_long
      - efloud_logs_long:/app/logs
      - efloud_reports_long:/app/reports_long
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: efloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      efloud-bot:
        # Use service_started (not service_healthy) so Caddy comes up even when
        # the bot is intentionally idle (EFLOUD_AUTOSTART=0), making the dashboard
        # reachable so the operator can press Start. See
        # docs/superpowers/specs/2026-05-15-autostart-friendly-compose-design.md.
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  autoheal:
    image: willfarrell/autoheal:1.2.0      # PINNED (do NOT use :latest in production)
    container_name: efloud-autoheal
    restart: always
    environment:
      - AUTOHEAL_INTERVAL=60        # check unhealthy containers every 60s
      - AUTOHEAL_START_PERIOD=600   # matches efloud-bot start_period (10-min warmup)
      - AUTOHEAL_CONTAINER_LABEL=autoheal  # only restart containers tagged autoheal=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  alerter:
    image: efloud-bot:latest          # reuse the bot's image (no separate Dockerfile)
    container_name: efloud-alerter
    restart: unless-stopped
    command: python -m ops.alerter.alerter
    env_file:
      - .env.production
    environment:
      - EFLOUD_LOG_FILE=/app/logs/efloud_bot.log
      - EFLOUD_HEALTHZ_URL=http://efloud-bot:8080/healthz
      - EFLOUD_ALERTER_DEDUP_DB=/app/state/alerter_dedup.sqlite
      - EFLOUD_ALERTER_HEARTBEAT_FILE=/app/state/alerter_heartbeat.json
    volumes:
      - efloud_logs:/app/logs:ro      # read-only — alerter only tails
      - efloud_state:/app/state       # read-write — dedup + heartbeat live here
    depends_on:
      efloud-bot:
        condition: service_started   # don't wait for healthy; alerter watches healthz
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  daily-report:
    image: efloud-bot:latest          # reuse the bot's image (same as alerter)
    container_name: efloud-daily-report
    profiles: [scheduled]             # NOT started by `up -d`; cron triggers via `run`
    command: python -m ops.daily_report.report
    env_file:
      - .env.production
    environment:
      - EFLOUD_ALERTER_HEARTBEAT_FILE=/app/state/alerter_heartbeat.json
    volumes:
      - efloud_state:/app/state:ro    # read-only — only reads heartbeat file
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────
  # Overseer agent (Track 3) — sidecar that observes the bot,
  # writes heartbeat + LLM-usage state, and (Week 2+) sends summaries.
  # Week 1 default: EFLOUD_OVERSEER_DRY_RUN=1 → log-only; Hermes
  # manually flips to 0 once the rollout stabilises.
  # ─────────────────────────────────────────────────────────────────
  overseer:
    image: efloud-bot:latest
    container_name: efloud-overseer
    restart: unless-stopped
    command: python -m ops.overseer watch
    env_file:
      - .env.production
    environment:
      - EFLOUD_LOG_FILE=/app/logs/efloud_bot.log
      - EFLOUD_HEALTHZ_URL=http://efloud-bot:8080/healthz
      - EFLOUD_OVERSEER_DEDUP_DB=/app/state/overseer_dedup.sqlite
      - EFLOUD_OVERSEER_HEARTBEAT_FILE=/app/state/overseer_heartbeat.json
      - EFLOUD_OVERSEER_JOURNAL_PATH=/app/state_aggressive/trade_journal.jsonl
      - EFLOUD_OVERSEER_STATE_DB=/app/state/overseer_state.sqlite
      - EFLOUD_OVERSEER_LLM_DAILY_CAP=500
      - EFLOUD_OVERSEER_DRY_RUN=1     # Week 1: log-only; Week 2+ Hermes flips to 0
      - ANTHROPIC_MODEL=claude-haiku-4-5-20251001
    volumes:
      - efloud_logs:/app/logs:ro
      - efloud_state_aggressive:/app/state_aggressive:ro
      - efloud_state:/app/state
    depends_on:
      efloud-bot:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  overseer-phase0:
    profiles: [overseer-scheduled]    # cron triggers via `docker compose run`
    image: efloud-bot:latest
    container_name: efloud-overseer-phase0
    command: python -m ops.overseer extract-phase0
    env_file:
      - .env.production
    environment:
      - EFLOUD_OVERSEER_STATE_DB=/app/state/overseer_state.sqlite
    volumes:
      - efloud_state_aggressive:/app/state_aggressive:ro
      - efloud_state:/app/state
      - efloud_reports:/app/reports
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

  overseer-daily-report:
    profiles: [overseer-scheduled]
    image: efloud-bot:latest
    container_name: efloud-overseer-daily-report
    command: python -m ops.overseer report
    env_file:
      - .env.production
    environment:
      - EFLOUD_OVERSEER_STATE_DB=/app/state/overseer_state.sqlite
      - ANTHROPIC_MODEL=claude-haiku-4-5-20251001
    volumes:
      - efloud_state_aggressive:/app/state_aggressive:ro
      - efloud_state:/app/state
      - efloud_reports:/app/reports
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

  routines-watcher:
    image: efloud-bot:latest
    container_name: efloud-routines
    command: python -m scripts.routines.runner watch
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - efloud_state:/app/state
      - efloud_reports:/app/reports
      - efloud_data:/app/data            # new volume for data/market/*
      - efloud_logs:/app/logs:ro
    depends_on:
      efloud-bot:
        condition: service_started   # watch even if bot idle

  routines-scheduled:
    image: efloud-bot:latest
    container_name: efloud-routines-scheduled
    profiles: [routines-scheduled]
    command: python -m scripts.routines.runner run
    env_file:
      - .env.production
    volumes:
      - efloud_state:/app/state
      - efloud_reports:/app/reports
      - efloud_data:/app/data
      - efloud_logs:/app/logs:ro
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

volumes:
  efloud_state:
  efloud_state_1k:
  efloud_state_aggressive:
  efloud_logs:
  efloud_reports:
  efloud_content_jobs:    # Lane A — content_job JSONL producer (efloud-bot PR #155)
  efloud_data:            # new volume for data/market/*
  efloud_state_long:      # V2 long-bot isolated state (breaker/positions/journal)
  efloud_logs_long:       # V2 long-bot isolated logs
  efloud_reports_long:    # V2 long-bot isolated reports
  caddy_data:
  caddy_config:
