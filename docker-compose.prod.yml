services:
  efloud-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: efloud-bot:latest
    container_name: efloud-bot
    restart: unless-stopped
    labels:
      - autoheal=true
    env_file:
      - .env.production
    expose:
      - "8080"  # internal-only; Caddy reverse-proxies via docker network
    volumes:
      - efloud_state:/app/state
      - efloud_state_1k:/app/state_1k
      - efloud_logs:/app/logs
      - efloud_reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: efloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      efloud-bot:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  autoheal:
    image: willfarrell/autoheal:1.2.0      # PINNED (do NOT use :latest in production)
    container_name: efloud-autoheal
    restart: always
    environment:
      - AUTOHEAL_INTERVAL=60        # check unhealthy containers every 60s
      - AUTOHEAL_START_PERIOD=120   # match efloud-bot start_period; ignore unhealthy during this window
      - AUTOHEAL_CONTAINER_LABEL=autoheal  # only restart containers tagged autoheal=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  alerter:
    image: efloud-bot:latest          # reuse the bot's image (no separate Dockerfile)
    container_name: efloud-alerter
    restart: unless-stopped
    command: python -m ops.alerter.alerter
    env_file:
      - .env.production
    environment:
      - EFLOUD_LOG_FILE=/app/logs/efloud_bot.log
      - EFLOUD_HEALTHZ_URL=http://efloud-bot:8080/healthz
      - EFLOUD_ALERTER_DEDUP_DB=/app/state/alerter_dedup.sqlite
      - EFLOUD_ALERTER_HEARTBEAT_FILE=/app/state/alerter_heartbeat.json
    volumes:
      - efloud_logs:/app/logs:ro      # read-only — alerter only tails
      - efloud_state:/app/state       # read-write — dedup + heartbeat live here
    depends_on:
      efloud-bot:
        condition: service_started   # don't wait for healthy; alerter watches healthz
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  daily-report:
    image: efloud-bot:latest          # reuse the bot's image (same as alerter)
    container_name: efloud-daily-report
    profiles: [scheduled]             # NOT started by `up -d`; cron triggers via `run`
    command: python -m ops.daily_report.report
    env_file:
      - .env.production
    environment:
      - EFLOUD_ALERTER_HEARTBEAT_FILE=/app/state/alerter_heartbeat.json
    volumes:
      - efloud_state:/app/state:ro    # read-only — only reads heartbeat file
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

volumes:
  efloud_state:
  efloud_state_1k:
  efloud_logs:
  efloud_reports:
  caddy_data:
  caddy_config:
