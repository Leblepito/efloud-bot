name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'claude/**'
      - 'feat/**'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          pip --version

      # Hermetic by design: no BINANCE/GEMINI/DATABASE secrets are
      # provided. The agent layer falls back to NEUTRAL with no API key,
      # and unit tests use stubs/pyfakefs — so the suite must pass without
      # any external service. A test that needs a live service should be
      # marked skip/xfail, not silently depended on.
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pytest -q --maxfail=0 --durations=10
