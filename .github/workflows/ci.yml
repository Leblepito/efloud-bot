name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'claude/**'
      - 'feat/**'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Needed so the failure-reporter step can post the captured log back to
# the PR (a channel we can read programmatically). Same-repo branch, so
# the default token has write.
permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: pytest (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # Every step tees into a shared log so the failure-reporter can post
      # the tail of whatever broke. `set -o pipefail` keeps the step's exit
      # status despite the tee.
      - name: Install dependencies
        run: |
          set -o pipefail
          { python -m pip install --upgrade pip
            pip install --retries 5 --timeout 120 -r requirements.txt
          } 2>&1 | tee -a /tmp/ci.log

      - name: Import smoke
        run: |
          set -o pipefail
          python -c "import ccxt, pandas, numpy, pyarrow, fastapi, anthropic, httpx, asyncpg, yaml; print('imports OK')" 2>&1 | tee -a /tmp/ci.log

      - name: Collect tests
        run: |
          set -o pipefail
          python -m pytest --collect-only -q 2>&1 | tee -a /tmp/ci.log

      # Hermetic by design: no BINANCE/GEMINI/DATABASE secrets. The agent
      # layer falls back to NEUTRAL with no API key; unit tests use
      # stubs/pyfakefs; DB integration tests self-skip when DATABASE_URL is
      # unset.
      #
      # Two formerly non-hermetic tests were made CI-safe and their exclusions
      # removed (the full suite now runs with no --ignore / --deselect):
      #   * H1 — backend/tests/test_binance_client_url_routing.py used to make a
      #     LIVE api.binance.com/exchangeInfo call (GitHub US runners got HTTP
      #     451, geo-restricted). Now loads vendored markets from
      #     fixtures/binance_markets.json instead of hitting the network.
      #   * H2 — tests/test_alerter_heartbeat.py used to write to a hardcoded
      #     absolute /app/state path (prod Docker WORKDIR → PermissionError on a
      #     bare runner). Now redirects DEDUP_DB to tmp_path.
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m pytest -q --maxfail=0 -ra --tb=short --durations=10 \
            2>&1 | tee -a /tmp/ci.log

      # Post the tail of the captured log back to the PR on ANY failure
      # (install / import / collect / test). This is the channel the bot
      # reads to diagnose without needing the raw Actions logs. Remove once
      # CI is stable.
      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ❌ CI failure — pytest (py3.11) @ ${GITHUB_SHA:0:7}"
            echo ""
            echo "Tail of the build/test log (last 80 lines):"
            echo ""
            echo '```'
            tail -n 80 /tmp/ci.log 2>/dev/null || echo "(no log captured — failure was before any logged step)"
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md --repo "${{ github.repository }}"

  # T-023 (P-003 W-R): secret scanning on the working tree. Uses `detect
  # --no-git` deliberately — full-history scans would permanently flag
  # already-rotated keys from old incidents (see PR #154 redaction); the
  # commercial gate (P-002 G5) only requires the CURRENT tree to be clean.
  # Pinned to v8.18.4 (last release with `detect --no-git`; later versions
  # renamed it to `gitleaks dir`).
  secret-scan:
    name: gitleaks (working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --no-git --no-banner --redact --verbose

  # T-023: the Next.js build was previously validated only inside the prod
  # Docker build — a broken frontend surfaced at deploy time, not PR time.
  # PR #170: monorepo layout — single root package-lock.json + npm workspaces
  # ([packages/*, frontend]); the frontend build resolves the @efloud/tokens
  # workspace, so install at root and target the `efloud-frontend` workspace.
  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace efloud-frontend

      - name: Unit tests
        run: npm run test --workspace efloud-frontend

      - name: Build
        run: npm run build --workspace efloud-frontend

  # T-023: LLTODO process lint (naming, required sections, claim limits,
  # scoreboard consistency, cross-refs) was previously run only by hand.
  lltodo-lint:
    name: lltodo lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run LLTODO lint
        run: python LLTODO/scripts/lltodo_lint.py
