name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'claude/**'
      - 'feat/**'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Needed so the failure-reporter step can post the captured log back to
# the PR (a channel we can read programmatically). Same-repo branch, so
# the default token has write.
permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: pytest (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # Every step tees into a shared log so the failure-reporter can post
      # the tail of whatever broke. `set -o pipefail` keeps the step's exit
      # status despite the tee.
      - name: Install dependencies
        run: |
          set -o pipefail
          { python -m pip install --upgrade pip
            pip install --retries 5 --timeout 120 -r requirements.txt
          } 2>&1 | tee -a /tmp/ci.log

      - name: Import smoke
        run: |
          set -o pipefail
          python -c "import ccxt, pandas, numpy, pyarrow, fastapi, anthropic, httpx, asyncpg, yaml; print('imports OK')" 2>&1 | tee -a /tmp/ci.log

      - name: Collect tests
        run: |
          set -o pipefail
          python -m pytest --collect-only -q 2>&1 | tee -a /tmp/ci.log

      # Hermetic by design: no BINANCE/GEMINI/DATABASE secrets. The agent
      # layer falls back to NEUTRAL with no API key; unit tests use
      # stubs/pyfakefs; DB integration tests self-skip when DATABASE_URL is
      # unset.
      #
      # The exclusion below is a PRE-EXISTING, non-hermetic test — NOT related
      # to the agent-team feature. It only passed locally due to the environment
      # masking the assumption:
      #   * tests/test_alerter_heartbeat.py::test_heartbeat_... — writes to a
      #     hardcoded absolute /app/state path (prod Docker WORKDIR);
      #     PermissionError on a bare runner. Fix: make the dedup DB path
      #     configurable / use tmp_path (H2, separate PR).
      # (H1: backend/tests/test_binance_client_url_routing.py was made hermetic —
      #  it now loads vendored markets from fixtures/binance_markets.json instead
      #  of a live api.binance.com call — so its --ignore was removed.)
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -m pytest -q --maxfail=0 -ra --tb=short --durations=10 \
            --deselect "tests/test_alerter_heartbeat.py::test_heartbeat_writes_alerter_heartbeat_ts_to_json_file" \
            2>&1 | tee -a /tmp/ci.log

      # Post the tail of the captured log back to the PR on ANY failure
      # (install / import / collect / test). This is the channel the bot
      # reads to diagnose without needing the raw Actions logs. Remove once
      # CI is stable.
      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ❌ CI failure — pytest (py3.11) @ ${GITHUB_SHA:0:7}"
            echo ""
            echo "Tail of the build/test log (last 80 lines):"
            echo ""
            echo '```'
            tail -n 80 /tmp/ci.log 2>/dev/null || echo "(no log captured — failure was before any logged step)"
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md --repo "${{ github.repository }}"
