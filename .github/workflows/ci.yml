name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'claude/**'
      - 'feat/**'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # --retries/--timeout harden against the transient pip/wheel/network
      # hiccups that can fail a fresh runner even when the code is fine.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 -r requirements.txt

      # Distinct step: if a heavy wheel didn't install, this fails with a
      # clear name BEFORE pytest, so "install broke" vs "tests broke" is
      # obvious from the Actions UI at a glance.
      - name: Import smoke
        run: |
          python -c "import ccxt, pandas, numpy, pyarrow, fastapi, anthropic, httpx, asyncpg, yaml; print('imports OK')"

      # Distinct step: collection-only surfaces import/collection errors
      # (the fast-fail class) separately from real test failures.
      - name: Collect tests
        run: python -m pytest --collect-only -q

      # Hermetic by design: no BINANCE/GEMINI/DATABASE secrets are provided.
      # The agent layer falls back to NEUTRAL with no API key, and unit tests
      # use stubs/pyfakefs — so the suite must pass without external services.
      # DB integration tests self-skip when DATABASE_URL is unset.
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pytest -q --maxfail=0 -ra --tb=short --durations=10
