name: Hermes Review Agent

# On-demand review + auto-fix pipeline. Triggered manually, by the scheduled
# review workflow when findings are detected, or when an issue is labeled
# "automated-review".
#
# This is the CI-resident counterpart to the Hermes cron job
# (efloud-review-triage, runs daily at 04:30 UTC+3).
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to process (optional)'
        required: false
        type: string
  workflow_call:
    inputs:
      issue_number:
        required: false
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    # Only run for automated-review label, or when called directly
    if: |
      github.event_name != 'issues' ||
      github.event.label.name == 'automated-review'
    name: Hermes review — ruff fix + analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 -r requirements.txt
          pip install ruff bandit

      # ── ruff: safe auto-fixes ──────────────────────────────────────────
      - name: ruff check (diagnostic)
        id: ruff_check
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee /tmp/ruff.log || true

      - name: ruff auto-fix
        id: ruff_fix
        run: |
          set -o pipefail
          ruff check --fix . 2>&1 | tee /tmp/ruff-fix.log
          git diff --exit-code && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create ruff fix PR
        if: steps.ruff_fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="hermes/ruff-fix-$(date -u +%Y%m%d-%H%M)"
          git config user.name  'hermes-agent[bot]'
          git config user.email 'hermes-agent[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -am 'fix: ruff --fix auto-apply (Hermes review agent)'
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --title 'fix: ruff auto-fixes (Hermes review agent)' \
            --body "Automated ruff fixes applied by the Hermes review agent.

          **Applied:** \`ruff check --fix .\`
          **Context:** These are safe, non-breaking lint fixes only.

          /cc @Leblep" \
            --label 'automated-review' \
            --repo "${{ github.repository }}")
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      # ── bandit: security analysis (report only) ─────────────────────────
      - name: bandit scan
        id: bandit
        continue-on-error: true
        run: |
          set -o pipefail
          bandit -r . -ll -q 2>&1 | tee /tmp/bandit.log || true

      # ── Report: comment on the triggering issue ─────────────────────────
      - name: Report to issue
        if: |
          (steps.ruff_fix.outputs.changed == 'true' || steps.bandit.outcome == 'failure') &&
          (github.event.inputs.issue_number != '' || github.event.issue.number != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUM="${{ github.event.inputs.issue_number || github.event.issue.number }}"
          if [ -z "$ISSUE_NUM" ]; then
            echo "No issue number provided — skipping comment."
            exit 0
          fi

          {
            echo "## 🤖 Hermes Review Agent — results"
            echo ""
            if [ "${{ steps.ruff_fix.outputs.changed }}" = "true" ]; then
              echo "### ✅ ruff auto-fix PR opened"
              echo "Safe lint fixes applied: ${{ steps.ruff_fix.outputs.pr_url || 'PR created' }}"
              echo ""
            fi
            echo "### 📋 Remaining ruff issues"
            echo '```'
            tail -n 30 /tmp/ruff.log 2>/dev/null || echo "(none)"
            echo '```'
            echo ""
            if [ "${{ steps.bandit.outcome }}" = "failure" ]; then
              echo "### ⚠️ bandit findings"
              echo '```'
              tail -n 30 /tmp/bandit.log 2>/dev/null || echo "(none)"
              echo '```'
            fi
          } > /tmp/report.md
          gh issue comment "$ISSUE_NUM" --body-file /tmp/report.md --repo "${{ github.repository }}"
